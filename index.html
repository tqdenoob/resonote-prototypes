<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<meta charset="utf-8">
<title>ResoNote Prototype 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  ResoNote Iteration 2 high-fidelity prototype (Prototype 2.0), G1T2.
  Built 26 Oct 2026 from the Iter1.4 low-fidelity prototype (16 views) and the
  21 Oct "ResoNote Hi-Fi Drill (HE fixes).html". Follows the Iter2.02 easy scenario:
  Clarence imports "Viva La Vida", picks tenor, fixes a 2-bar count-in offset, loops
  the bridge (bars 33-48) at half speed, records it, and drills bar 42.
  Simulated: file picker, audio-to-score sync, pitch detection, microphone input level,
  AI coach scores and drill results (scripted, the same on every run). Reference audio is
  a Web Audio synth of the tenor line.
  LLM declaration: AI-drafted (Claude). The team must run the scenario on a phone-sized
  screen and check every label against Iter2.02, Iter2.03 and Iter2.04 before submitting.
-->
<style>
/* Layout: a phone-sized app on the left, a "prototype guide" rail on the right (stacks below on phones). */
:root{
  --page:#E7E5DE; --bg:#F4F3EE; --card:#FFFFFF; --sunk:#F2F1EC; --ink:#17181C; --muted:#5B5E66;
  --line:#E2E0D8; --line2:#D2CFC5; --staff:#8F929A;
  --blue:#2F45C6; --blue-soft:#E8EBFA; --blue-ink:#22339A; --on-accent:#FFFFFF;
  --orange:#C2570F; --orange-soft:#FBEADF; --orange-ink:#8A3A0C;
  --red:#B42318; --red-soft:#FBE4E1; --green:#1E7B4A; --green-soft:#E1F2E8;
  --amber:#9A6A00; --amber-soft:#FBF1D6; --scrim:rgba(23,24,28,.48); --spot:#FFB547;
  --sec-a:#ECEAE3; --sec-b:#E3E1D9; --wave:#B8B5AB;
  --f-ui:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#0D0E11; --bg:#16171C; --card:#202128; --sunk:#1B1C22; --ink:#ECECEF; --muted:#A3A6AF;
  --line:#2F3139; --line2:#3D4049; --staff:#6E717B;
  --blue:#8191F2; --blue-soft:#272D55; --blue-ink:#BCC5FB; --on-accent:#10122A;
  --orange:#F09A5B; --orange-soft:#3A2416; --orange-ink:#F6BC8F;
  --red:#F2786C; --red-soft:#3B1D1A; --green:#62CC92; --green-soft:#16301F;
  --amber:#E5B94E; --amber-soft:#342A10; --scrim:rgba(0,0,0,.6); --spot:#FFB547;
  --sec-a:#25262D; --sec-b:#2C2D35; --wave:#555862; color-scheme:dark }}
:root[data-theme="dark"]{
  --page:#0D0E11; --bg:#16171C; --card:#202128; --sunk:#1B1C22; --ink:#ECECEF; --muted:#A3A6AF;
  --line:#2F3139; --line2:#3D4049; --staff:#6E717B;
  --blue:#8191F2; --blue-soft:#272D55; --blue-ink:#BCC5FB; --on-accent:#10122A;
  --orange:#F09A5B; --orange-soft:#3A2416; --orange-ink:#F6BC8F;
  --red:#F2786C; --red-soft:#3B1D1A; --green:#62CC92; --green-soft:#16301F;
  --amber:#E5B94E; --amber-soft:#342A10; --scrim:rgba(0,0,0,.6); --spot:#FFB547;
  --sec-a:#25262D; --sec-b:#2C2D35; --wave:#555862; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:14px/1.4 var(--f-ui);padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;max-width:1120px;margin:0 auto}

/* ---------- Guide rail ---------- */
.guide{width:360px;max-width:100%;display:flex;flex-direction:column;gap:14px;min-width:0}
.guide h1{font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.guide .lede{margin:0;color:var(--muted);font-size:13px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.gcard h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.vlist{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.vlist button{width:100%;display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 8px}
.vlist button:hover{background:var(--sunk)}
.vlist button[aria-current="true"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:700}
.vlist .n{font-variant-numeric:tabular-nums;color:var(--muted);width:18px;flex:none;font-size:12px}
.vlist button[aria-current="true"] .n{color:var(--blue-ink)}
.gnow .vn{font-size:17px;font-weight:700}
.gnow p{margin:0;font-size:13px}
.gnow dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:6px 10px;font-size:13px}
.gnow dt{color:var(--muted);font-weight:600}
.gnow dd{margin:0;min-width:0}
.gnow ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.he{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--orange-soft);color:var(--orange-ink);margin-right:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 6px;font-size:13px;font-weight:600;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-accent)}
.gsmall{font-size:12px;color:var(--muted);margin:0}
.grow{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}

/* ---------- Phone ---------- */
.phone{width:390px;height:844px;max-width:100%;border-radius:32px;overflow:hidden;position:relative;background:var(--bg);
  box-shadow:0 0 0 8px var(--ink),0 18px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;flex:none}
@media (max-width:480px){
  .phone{width:100%;height:calc(100svh - 40px);min-height:640px;border-radius:22px;box-shadow:0 0 0 1px var(--line2)}
  .wrap{gap:24px}
}
.scr{display:flex;flex-direction:column;height:100%;min-height:0}
.hdr{height:56px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 6px;flex:none}
.hdr .ttl{text-align:center;min-width:0}
.hdr .ttl b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl span{display:block;font-size:12px;color:var(--muted)}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--sunk)}
.body{padding:2px 18px 14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.ftr{padding:10px 18px 22px;display:flex;gap:10px;align-items:center;flex:none;border-top:1px solid var(--line);background:var(--bg)}
.ftr.col{flex-direction:column;align-items:stretch}
.ftr.col .btn{flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:12px 14px}
.h1{font-size:22px;font-weight:800;margin:4px 0 0;line-height:1.2;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:14px}
.sub{font-size:13px;color:var(--muted)}
.lbl{font-size:15px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* step indicator (HE #15) */
.steps3{display:flex;flex-direction:column;gap:6px}
.steps3 .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps3 .bars i{height:5px;border-radius:3px;background:var(--line)}
.steps3 .bars i.on{background:var(--blue)}

/* buttons */
.btn{height:54px;border-radius:16px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;border:0;padding:0 16px}
.btn.pri{flex:1;background:var(--blue);color:var(--on-accent)}
.btn.rec{flex:1;background:var(--blue);color:var(--on-accent)}
.btn.stop{flex:1;background:var(--ink);color:var(--bg)}
.btn.sec{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:15px;font-weight:600}
.btn.ghost{border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:15px;font-weight:600}
.btn.danger{background:var(--red);color:var(--on-accent)}
.btn.full{width:100%}
.btn:disabled,.mini:disabled,.sbtn:disabled{opacity:.42;cursor:not-allowed}
.dot{width:12px;height:12px;border-radius:50%;background:currentColor}
.sq{width:12px;height:12px;border-radius:2px;background:currentColor}
.mini{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.mini.on{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.mini.danger{color:var(--red)}
.link{border:0;background:none;color:var(--blue-ink);font-weight:700;padding:4px 0;font-size:13px}

/* chips & badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.o{background:var(--orange-soft);color:var(--orange-ink)}
.badge.b{background:var(--blue-soft);color:var(--blue-ink)}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.a{background:var(--amber-soft);color:var(--amber)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:600}
.chip.clean{background:var(--blue-soft);color:var(--blue-ink)}
.chip.miss{background:var(--orange-soft);color:var(--orange-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px}

/* switches */
.switch{display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;padding:0}
.switch .word{font-size:14px;font-weight:700;width:28px;text-align:right}
.track{width:46px;height:28px;border-radius:999px;position:relative;display:inline-block;background:var(--line2);transition:background .15s}
.track.on{background:var(--blue)}
.knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.track.on .knob{left:21px}
.set-row{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:8px}
.set-row+.set-row{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.sbtn{width:40px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:20px;line-height:1}
.bpm-btn{min-width:104px;height:36px;border:1px dashed var(--line2);border-radius:10px;background:var(--card);padding:0 6px;font-variant-numeric:tabular-nums}
.bpm-btn b{font-size:16px}
.bpm-btn span{font-size:12px;color:var(--muted)}
.bpm-edit{display:flex;gap:6px;align-items:center}
.bpm-edit input{width:70px;height:36px;border:2px solid var(--blue);border-radius:10px;text-align:center;font-size:16px;background:var(--card)}
.bpm-edit .done{height:36px;padding:0 12px;border-radius:10px;border:0;background:var(--blue);color:var(--on-accent);font-weight:700}
.err{font-size:12px;color:var(--red);font-weight:600}
input[type=range]{width:100%;accent-color:var(--blue);margin:0}

/* score */
.score{position:relative;margin:0 auto;overflow:hidden}
.score svg{display:block;max-width:100%;height:auto}
.stf .ln{stroke:var(--staff);stroke-width:1}
.stf .bl{stroke:var(--ink);stroke-width:1.3}
.stf .nh{fill:var(--ink);stroke:var(--ink);stroke-width:1.3}
.stf .nh.o{fill:var(--card)}
.stf .st{stroke:var(--ink);stroke-width:1.3}
.stf .bm{fill:var(--ink)}
.stf .num{fill:var(--muted);font:600 10px var(--f-ui)}
.stf .num.on{fill:var(--blue-ink)}
.stf .hl-loop{fill:var(--blue-soft)}
.stf .hl-focus{fill:var(--orange-soft)}
.stf .hl-sel{fill:none;stroke:var(--orange);stroke-width:1.5;stroke-dasharray:3 3}
.stf .dim{fill:var(--card);opacity:.78}
.stf .gd{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:4 4;stroke-linecap:round}
.stf .gn{fill:var(--blue);font:700 10px var(--f-ui)}
.stf .rest{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.stf .nm{fill:var(--blue-ink);font:700 9px var(--f-ui)}
.ph{position:absolute;width:2px;background:var(--blue);pointer-events:none;display:none}
.ph.paused{background:repeating-linear-gradient(var(--blue) 0 6px,transparent 6px 10px)}
.scap{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0;font-size:13px;min-height:28px}
.recl{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:700}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* loop timeline (Change 3, HE #4) */
.tl{position:relative;height:74px;margin:4px 6px 0;touch-action:none;user-select:none}
.tl .secs{position:absolute;left:0;right:0;top:0;height:20px}
.tl .sec{position:absolute;top:0;height:20px;font-size:10px;font-weight:700;color:var(--muted);padding:3px 0 0 4px;white-space:nowrap;overflow:hidden;border-left:1px solid var(--line2)}
.tl .wv{position:absolute;left:0;right:0;top:22px;height:40px;border-radius:6px;background:var(--sunk);overflow:hidden}
.tl .wv svg{width:100%;height:100%;display:block}
.tl .wv rect{fill:var(--wave)}
.tl .sel{position:absolute;top:20px;height:44px;background:rgba(47,69,198,.16);border:2px solid var(--blue);border-radius:6px;pointer-events:none}
.tl .hd{position:absolute;top:16px;width:30px;height:52px;margin-left:-15px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;cursor:ew-resize}
.tl .hd i{width:14px;height:44px;border-radius:5px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tl .hd i::after{content:"";width:2px;height:16px;border-left:1px solid var(--on-accent);border-right:1px solid var(--on-accent);opacity:.8}
.tl .tph{position:absolute;top:20px;height:44px;width:2px;background:var(--ink);pointer-events:none}
.tl .ax{position:absolute;left:0;right:0;bottom:0;height:12px;font-size:10px;color:var(--muted)}
.tl .ax span{position:absolute;transform:translateX(-50%)}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.readout b{font-size:15px}

/* keyboard (HE #18) */
.kb{position:relative;height:96px;display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--card)}
.kb .w{flex:1;border:0;border-right:1px solid var(--line2);background:var(--card);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:10px;font-weight:700;color:var(--muted)}
.kb .w:last-child{border-right:0}
.kb .w.hit{background:var(--blue-soft);color:var(--blue-ink)}
.kb .k{position:absolute;top:0;width:5%;height:58%;background:var(--ink);border:0;border-radius:0 0 4px 4px;padding:0}
.kb .k.hit{background:var(--blue)}

/* meter (HE #9) */
.meter{display:flex;align-items:center;gap:10px}
.meter .bars{display:flex;align-items:flex-end;gap:3px;height:26px;flex:none}
.meter .bars i{display:block;width:5px;border-radius:2px;background:var(--green);height:4px}
.meter .lvl{font-size:13px;font-weight:700;color:var(--green)}

/* lists */
.song{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:16px;text-align:left;width:100%}
.song .art{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.song .meta{flex:1;min-width:0}
.song .meta b{display:block;font-size:15px}
.song .meta span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;height:46px;border:1px solid var(--line2);border-radius:14px;padding:0 12px;background:var(--card)}
.search input{border:0;background:transparent;flex:1;min-width:0;height:100%;font-size:15px;outline:none}
.fab{position:absolute;right:20px;bottom:28px;height:56px;border-radius:18px;padding:0 20px;border:0;background:var(--blue);color:var(--on-accent);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(47,69,198,.35)}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--line2);background:var(--card)}
.file.ok{border-style:solid;border-color:var(--line)}
.file.bad{border-color:var(--red);border-style:solid}
.file .fi{width:40px;height:40px;border-radius:10px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.file.ok .fi{background:var(--blue-soft);color:var(--blue-ink)}
.file .ft{flex:1;min-width:0}
.file .ft b{display:block;font-size:14px}
.file .ft span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field label{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.field input{width:100%;height:46px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;font-size:15px;background:var(--card)}
.field input.bad{border:2px solid var(--red)}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);width:100%;text-align:left}
.opt.on{border:2px solid var(--blue);background:var(--blue-soft)}
.opt .ot{font-size:15px;font-weight:700;display:block}
.opt .od{font-size:12px;color:var(--muted);display:block}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center}
.opt.on .radio{border-color:var(--blue)}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}

/* feedback */
.overall{display:flex;align-items:center;gap:14px}
.ring{width:72px;height:72px;flex:none}
.ring .bg{stroke:var(--line);fill:none;stroke-width:8}
.ring .fg{stroke:var(--blue);fill:none;stroke-width:8;stroke-linecap:round}
.ring text{fill:var(--ink);font:800 20px var(--f-ui)}
.metric{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.metric+.metric{border-top:1px solid var(--line)}
.metric .top{display:flex;align-items:center;gap:6px}
.metric .nm{font-size:15px;font-weight:700}
.metric .sc{margin-left:auto;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.metric .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.metric .bar i{display:block;height:100%;border-radius:3px}
.metric .tip{font-size:13px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.info{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.info[aria-expanded="true"]{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.bstrip{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.bstrip span{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.bstrip .g{background:var(--green-soft);color:var(--green)}
.bstrip .a{background:var(--amber-soft);color:var(--amber)}
.bstrip .r{background:var(--orange);color:var(--on-accent)}
.prio{border:2px solid var(--orange);background:var(--card)}
.issue{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.issue .tag{flex:none;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--orange-soft);color:var(--orange-ink);min-width:62px;text-align:center}
.saved{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--green)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.cmp{display:flex;align-items:center;gap:12px;padding:10px 14px}
.cmp .pb{width:44px;height:44px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;flex:none}
.cmp .pb.you{background:var(--orange-soft);color:var(--orange-ink)}
.cmp .pb.ref{background:var(--blue-soft);color:var(--blue-ink)}
.chart .tg{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1}
.chart .you{fill:none;stroke:var(--orange);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:600 10px var(--f-ui)}
.chart .an{fill:var(--orange-ink);font:700 10px var(--f-ui)}
.chart .cur{stroke:var(--ink);stroke-width:1.5}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* drill */
.coach-head{display:flex;justify-content:space-between;align-items:center;padding-top:12px}
.coach-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--blue-ink);background:var(--blue-soft);padding:3px 8px;border-radius:999px}
.dsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0 4px}
.dsteps .bar{height:6px;border-radius:3px;background:var(--line)}
.dsteps .bar.on{background:var(--blue)}
.dsteps .t{font-size:12px;line-height:1.25;color:var(--muted);margin-top:4px}
.dsteps .t.on{font-weight:700;color:var(--ink)}
.ro{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 0 12px}
.ro div{background:var(--sunk);border-radius:10px;padding:6px 10px}
.ro .k{font-size:12px;color:var(--muted)}
.ro .v{font-size:15px;font-weight:700}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);border:1px dashed var(--line2)}
.slot.done{background:var(--blue);color:var(--on-accent);border:1px solid var(--blue)}
.msg{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.msg.clean{color:var(--blue-ink)}
.msg.miss{color:var(--orange-ink)}
.countin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--blue);background:color-mix(in srgb,var(--card) 70%,transparent);pointer-events:none}

/* summary */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat3 b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat3 span{font-size:12px;color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;font-size:13px}
.hist div+div{border-top:1px solid var(--line)}
.big-ic{width:56px;height:56px;border-radius:50%;background:var(--blue);color:var(--on-accent);display:flex;align-items:center;justify-content:center}

/* sync */
.sync{position:relative;padding:12px 0 8px;overflow:hidden}
.sync .lane{position:relative;height:46px;margin:0 12px}
.sync .lane+.lane{margin-top:12px}
.sync .lt{font-size:11px;font-weight:700;color:var(--muted);margin:0 12px 4px}
.sync .bx{position:absolute;top:0;height:46px;border:1px solid var(--line2);border-radius:6px;background:var(--sunk);font-size:10px;font-weight:700;color:var(--muted);padding:3px 5px}
.sync .bx i{position:absolute;bottom:8px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.sync .aud{position:absolute;top:0;height:46px;left:0;will-change:transform}
.sync .aud .ci{position:absolute;top:14px;width:3px;height:18px;border-radius:2px;background:var(--orange)}
.sync .aud .sn{position:absolute;top:8px;height:30px;border-radius:4px;background:var(--wave)}
.sync .aud .lab{position:absolute;top:34px;font-size:10px;font-weight:700;color:var(--orange-ink);white-space:nowrap}
.sync .mk{position:absolute;top:8px;bottom:6px;width:2px;background:var(--blue);z-index:2}
.sync .mk span{position:absolute;top:-2px;left:5px;font-size:10px;font-weight:700;color:var(--blue-ink);white-space:nowrap}
.sync .uph{position:absolute;top:28px;bottom:6px;width:2px;background:var(--ink);z-index:3;display:none}
.sync .umk{position:absolute;top:70px;height:46px;width:2px;background:var(--green);z-index:2}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:22px 22px 28px;display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto}
.sheet h3{margin:0;font-size:19px;text-wrap:balance}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
.tour{position:absolute;inset:0;z-index:30}
.spot{position:absolute;border:3px solid var(--spot);border-radius:14px;box-shadow:0 0 0 2000px rgba(13,14,17,.62);pointer-events:none;transition:all .2s}
.tip{position:absolute;left:14px;right:14px;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px}
.tip .tt{font-size:16px;font-weight:700}
.tip .tx{font-size:14px;line-height:1.45}
.tip .tn{display:flex;justify-content:space-between;align-items:center}
.toast{position:absolute;left:14px;right:14px;bottom:100px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:25}
.toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);border-radius:10px;height:36px;padding:0 12px;font-weight:700;flex:none}
.empty{padding:22px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

var AU = {ctx:null, out:null};
function ac(){

  if (AU.ctx && AU.ctx.state === "suspended") AU.ctx.resume();
  return AU.ctx;
}
function tone(midi, dur, vol, detune, delay){
  var c = ac(); if (!c || vol <= 0) return;
  var t = c.currentTime + (delay||0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = "triangle"; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12); o.detune.value = detune || 0;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
  g.gain.setValueAtTime(vol, t + Math.max(.03, dur - .06)); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g); g.connect(AU.out); o.start(t); o.stop(t + dur + .05);
}

  var c = ac(); if (!c) return;
  var t = c.currentTime, o = c.createOscillator(), g = c.createGain();

  g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .05);
  o.connect(g); g.connect(AU.out); o.start(t); o.stop(t + .06);
}

    if (tr.loop){ p1 = tr.a + (p1 - tr.b); scan(tr.a, p1); tr.pos = p1; return false; }

/* ================= Score renderer (SVG) ================= */
var NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
var STEP_IDX = {0:0,2:1,4:2,5:3,7:4,9:5,11:6};
function stepOf(m){ return (Math.floor(m / 12) - 1) * 7 + STEP_IDX[m % 12]; }
function noteName(m){ return NAMES[m % 12] + (Math.floor(m / 12) - 1); }
var GAP = 7;
function staffGeom(bars, W){ var L = 4; return {L:L, bw:(W - L * 2) / bars.length, top:24}; }
function noteX(g, i, beat){ return g.L + i * g.bw + 10 + beat / 4 * (g.bw - 16); }
function staff(bars, W, o){
  o = o || {};
  var g = staffGeom(bars, W), top = g.top, H = top + 4 * GAP + 26, s = "";
  s += '<svg class="stf" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Score, tenor part, bars ' + bars[0] + ' to ' + bars[bars.length - 1] + '">';
  bars.forEach(function(b, i){
    var x = g.L + i * g.bw;
    if (o.loop && b >= o.loop[0] && b <= o.loop[1]) s += '<rect class="hl-loop" x="' + x + '" y="' + (top - 16) + '" width="' + g.bw + '" height="' + (4 * GAP + 34) + '"/>';
    if (o.focus === b) s += '<rect class="hl-focus" x="' + (x + 1) + '" y="' + (top - 16) + '" width="' + (g.bw - 2) + '" height="' + (4 * GAP + 34) + '" rx="6"/>';
  });
  for (var k = 0; k < 5; k++) s += '<line class="ln" x1="' + g.L + '" x2="' + (W - g.L) + '" y1="' + (top + k * GAP) + '" y2="' + (top + k * GAP) + '"/>';
  for (var j = 0; j <= bars.length; j++){ var bx = g.L + j * g.bw; s += '<line class="bl" x1="' + bx + '" x2="' + bx + '" y1="' + top + '" y2="' + (top + 4 * GAP) + '"/>'; }
  bars.forEach(function(b, i){
    var x0 = g.L + i * g.bw;
    s += '<text class="num' + ((o.focus === b) ? " on" : "") + '" x="' + (x0 + 3) + '" y="' + (top - 6) + '">' + b + '</text>';
    var ns = NOTES[b], yOf = function(m){ return top + 4 * GAP - (stepOf(m + 12) - 30) * GAP / 2; };
    if (ns[0][1] > 0){ var rx = noteX(g, i, 0); s += '<path class="rest" d="M' + (rx - 2) + ' ' + (top + 6) + 'l4 5-4 5 5 6"/>'; }
    var groups = {};
    ns.forEach(function(n){ if (n[2] === .5){ var key = Math.floor(n[1]); (groups[key] = groups[key] || []).push(n); } });
    ns.forEach(function(n){
      var x = noteX(g, i, n[1]), y = yOf(n[0]), st = stepOf(n[0] + 12);
      for (var lst = 28; lst >= st; lst -= 2){ var ly = top + 4 * GAP - (lst - 30) * GAP / 2; s += '<line class="st" x1="' + (x - 8) + '" x2="' + (x + 8) + '" y1="' + ly + '" y2="' + ly + '"/>'; }
      for (var hst = 40; hst <= st; hst += 2){ var hy = top + 4 * GAP - (hst - 30) * GAP / 2; s += '<line class="st" x1="' + (x - 8) + '" x2="' + (x + 8) + '" y1="' + hy + '" y2="' + hy + '"/>'; }
      s += '<ellipse class="nh' + (n[2] >= 2 ? " o" : "") + '" cx="' + x + '" cy="' + y + '" rx="4.6" ry="3.4" transform="rotate(-20 ' + x + ' ' + y + ')"/>';
      if (o.names) s += '<text class="nm" x="' + (x - 5) + '" y="' + (top + 4 * GAP + 22) + '">' + NAMES[n[0] % 12] + '</text>';
      if (n[2] < 4 && n[2] !== .5){ var up = st < 34; s += up ? '<line class="st" x1="' + (x + 4.3) + '" x2="' + (x + 4.3) + '" y1="' + y + '" y2="' + (y - 22) + '"/>' : '<line class="st" x1="' + (x - 4.3) + '" x2="' + (x - 4.3) + '" y1="' + y + '" y2="' + (y + 22) + '"/>'; }
    });
    Object.keys(groups).forEach(function(key){
      var gr = groups[key], avg = 0; gr.forEach(function(n){ avg += stepOf(n[0] + 12); }); avg /= gr.length;
      var up = avg < 34, pts = gr.map(function(n){ return {x:noteX(g, i, n[1]) + (up ? 4.3 : -4.3), y:yOf(n[0])}; });
      var tip = up ? Math.min.apply(null, pts.map(function(p){ return p.y; })) - 22 : Math.max.apply(null, pts.map(function(p){ return p.y; })) + 22;
      pts.forEach(function(p){ s += '<line class="st" x1="' + p.x + '" x2="' + p.x + '" y1="' + p.y + '" y2="' + tip + '"/>'; });
      if (pts.length > 1) s += '<rect class="bm" x="' + pts[0].x + '" y="' + (up ? tip : tip - 3.5) + '" width="' + (pts[pts.length - 1].x - pts[0].x + 1) + '" height="3.5"/>';
      else s += '<path class="st" d="M' + pts[0].x + ' ' + tip + 'q6 6 5 12" fill="none"/>';
    });
    if (o.guide === b){
      var pl = ns.map(function(n){ return noteX(g, i, n[1]) + ',' + (yOf(n[0]) - 9); }).join(" ");
      s += '<polyline class="gd" points="' + pl + ' ' + (x0 + g.bw - 6) + ',' + (yOf(ns[ns.length - 1][0]) - 9) + '"/>';
      for (var bt = 0; bt < 4; bt++) s += '<text class="gn" x="' + (noteX(g, i, bt) - 3) + '" y="' + (top + 4 * GAP + 20) + '">' + (bt + 1) + '</text>';
    }
    if (o.chunk && o.chunkBar === b){
      var cx1 = noteX(g, i, o.chunk.a) - 8, cx2 = o.chunk.b >= 4 ? x0 + g.bw : noteX(g, i, o.chunk.b) - 8;
      if (cx1 > x0) s += '<rect class="dim" x="' + x0 + '" y="' + (top - 16) + '" width="' + (cx1 - x0) + '" height="' + (4 * GAP + 40) + '"/>';
      if (cx2 < x0 + g.bw) s += '<rect class="dim" x="' + cx2 + '" y="' + (top - 16) + '" width="' + (x0 + g.bw - cx2) + '" height="' + (4 * GAP + 40) + '"/>';
    }
  });
  return s + "</svg>";
}
function phX(bars, W, pos){
  var g = staffGeom(bars, W), i = Math.floor(pos) - (bars[0] - 1);

/* ================= Drill logic ================= */
function drillSnapshot(){ var d = S.drill; return JSON.stringify({tempo:d.tempo, guidance:d.guidance, chunk:d.chunk, takes:d.takes, streak:d.streak, misses:d.misses, targetTries:d.targetTries, msg:d.msg, last:d.last}); }
function drillRange(){ var d = S.drill, c = d.chunk !== null ? CHUNKS[d.chunk] : {a:0, b:4}; return {a:41 + c.a / 4, b:41 + c.b / 4}; }
function judgeDrill(){
  // Scripted: the first 2 takes at the goal settings (whole bar, 100%, guidance off) are missed.
  var d = S.drill, atTarget = d.tempo >= 100 && !d.guidance && d.chunk === null;
  if (atTarget && d.targetTries < 2) return {clean:false, reason: d.targetTries === 0 ? "pitch" : "timing", atTarget:true};
  return {clean:true, atTarget:atTarget};
}
function markDrill(){
  var d = S.drill, r = judgeDrill(), isB = S.variant === "B";
  d.undo = drillSnapshot();
  if (r.atTarget) d.targetTries++;
  var take = {n:d.takes.length + 1, tempo:d.tempo, guidance:d.guidance, chunk:d.chunk, clean:r.clean, reason:r.reason || null};
  d.takes = d.takes.concat([take]); d.phase = "idle"; S.session.drillTakes++;
  if (!isB){
    d.streak = r.clean && r.atTarget ? d.streak + 1 : 0;
    d.last = {clean:r.clean, atTarget:r.atTarget, reason:r.reason, n:take.n};
    if (d.streak >= 2) d.sheet = "done";
  } else {
    d.last = {clean:r.clean, reason:r.reason, n:take.n};
    if (r.clean){
      d.misses = 0;
      if (d.chunk !== null){
        if (d.chunk < 2){ d.chunk++; d.msg = "Clean. Now " + CHUNKS[d.chunk].name.toLowerCase() + "."; }
        else { d.chunk = null; d.streak = 0; d.msg = "All three pieces clean. Put them together: the whole bar, full speed, on your own."; }
      }
      else if (d.tempo < 100){ d.tempo = 100; d.streak = 0; d.msg = "Clean! Tempo up to 100%. Guidance stays on for now."; }
      else if (d.guidance){ d.guidance = false; d.streak = 0; d.msg = "Clean at full speed. Guidance off: this one's all you."; }
      else { d.streak++; if (d.streak >= 2){ d.sheet = "done"; d.msg = "Mastered."; } else d.msg = "1 of 2 clean on your own. One more like that."; }
    } else {

      else d.msg = "Not quite: " + why + ". Same settings, once more.";
    }

  d.pos = 0;
  render();
}
function startDrillRecording(){

function endDrillTake(){ var d = S.drill; d.phase = "judging"; S.judgeT = 0; render(); }

/* ================= Animation loop ================= */
var lastTs = null;
function tick(ts){
  var dt = lastTs === null ? 0 : Math.min(.1, (ts - lastTs) / 1000); lastTs = ts;
  var w = S.ws;
  // workspace playback
  if (S.view === "workspace" && w.playing){
    var prevBar = Math.floor(w.pos);
    var tr = {pos:w.pos, a:w.loop ? w.loopA - 1 : 0, b:w.loop ? w.loopB : NBARS, loop:true, bpm:wsBpm()};
    if (!w.loop && w.pos < tr.a) tr.a = 0;
    var ended = advance(tr, dt, function(n, bar, barSec){
      if (!w.tenorMute) tone(n[0], n[2] / 4 * barSec * .95, .22 * w.tenorVol / 100);
      flashKey(n[0], n[2] / 4 * barSec);
    }, function(k, bar){
      if (w.metro) click(k === 0);
      if (k === 0 && !w.othersMute) chord(bar, .2 * w.othersVol / 100);
    });
    w.pos = tr.pos;
    if (!w.loop && w.pos >= w.loopB){ w.pos = w.loopB; }
    if (wsSystemKey() !== S._sysKey) refreshScore();
  }
  // passage recording
  if (S.view === "record" && S.rec.phase !== "judging" && S.rec.phase !== "idle"){
    var r = S.rec, beatSec = 60 / wsBpm();
    if (r.phase === "countin"){
      r.t += dt;
      var cb = Math.floor(r.t / beatSec);
      if (cb !== r.countBeat){ r.countBeat = cb; if (cb < 4){ click(false); var ce = phone.querySelector("[data-count]"); if (ce) ce.textContent = cb + 1; } }
      if (r.t >= beatSec * 4){ r.phase = "recording"; var cel = phone.querySelector("[data-count]"); if (cel) cel.remove(); }
    } else {
      var rtr = {pos:r.pos, a:w.loopA - 1, b:w.loopB, loop:false, bpm:wsBpm()};
      var done = advance(rtr, dt, function(n, bar, barSec){ tone(n[0], n[2] / 4 * barSec * .95, .08); }, function(k, bar){ if (k === 0) chord(bar, .06); });
      r.pos = rtr.pos;
      if (Math.floor(r.pos / 4) !== S._recSys){ S._recSys = Math.floor(r.pos / 4); refreshRecScore(); }
      if (done) finishRecording();
    }
  }
  // judging progress
  if (S.sheet === "judging" || (S.drill && S.drill.phase === "judging" && S.view === "drill")){
    S.judgeT = (S.judgeT || 0) + dt;
    var jb = phone.querySelector("[data-judge]"); if (jb) jb.style.width = Math.min(100, S.judgeT / 1.4 * 100) + "%";
    if (S.judgeT >= 1.4){
      S.judgeT = 0;
      if (S.sheet === "judging"){ S.sheet = null; S.rec.phase = "idle"; addTake(Math.round(S._len)); S.openInfo = null; S.view = "feedback"; render(); var b = phone.querySelector(".body"); if (b) b.scrollTop = 0; try { history.replaceState(null, "", "#feedback"); } catch(e){} }
      else markDrill();
    }
  }
  // drill playback / recording
  if (S.view === "drill" && S.drill){
    var d = S.drill, dbpm = drillBpm(), rg = drillRange();
    if (d.phase === "countin"){
      d.countT += dt; var db = Math.floor(d.countT / (60 / dbpm));
      if (db !== d.countBeat){ d.countBeat = db; if (db < 4){ click(false); var dce = phone.querySelector("[data-count]"); if (dce) dce.textContent = db + 1; } }
      if (d.countT >= 4 * 60 / dbpm){ d.phase = "recording"; render(); }
    } else if (d.phase === "recording" || d.playing){
      if (d.pos < rg.a || d.pos >= rg.b) d.pos = rg.a;
      var dtr = {pos:d.pos, a:rg.a, b:rg.b, loop:d.phase !== "recording", bpm:dbpm};
      var fin = advance(dtr, dt, function(n, bar, barSec){
        if (bar !== 42) return;
        if (d.playing || d.guidance) tone(n[0], n[2] / 4 * barSec * .95, d.playing ? .24 : .08);
      }, null);
      d.pos = dtr.pos;
      if (fin && d.phase === "recording") endDrillTake();
    }
  }
  // sync playback
  if (S.view === "sync" && S.sync.playing){
    var y = S.sync, prevT = y.t; y.t += dt;
    var beat = 60 / BPM;
    for (var c = 0; c < 8; c++){ var ct = c * beat; if (ct >= prevT && ct < y.t) click(c % 4 === 0); }
    for (var bb = 1; bb <= 4; bb++) NOTES[bb].forEach(function(n){ var nt = -SYNC_TRUE + (bb - 1) * 240 / BPM + n[1] * beat; if (nt >= prevT && nt < y.t) tone(n[0], n[2] * beat * .95, .22); });
    if (y.t > -SYNC_TRUE + 4 * 240 / BPM){ y.playing = false; render(); }
  }
  drawDynamic();
  requestAnimationFrame(tick);
}
function wsSystemKey(){ return wsSystem()[0]; }
function refreshScore(){
  var el = phone.querySelector("[data-score]"); if (!el) return;
  var bars = wsSystem(); S._sysKey = bars[0];
  el.innerHTML = staff(bars, SCORE_W, {loop:[S.ws.loopA, S.ws.loopB]}) + '<div class="ph" data-ph style="top:8px;height:58px"></div>';
  var sys = phone.querySelector("[data-sys]"); if (sys) sys.textContent = "Bars " + bars[0] + "–" + bars[bars.length - 1] + " · " + sectionOf(bars[0]);
}
function refreshRecScore(){
  var el = phone.querySelector("[data-score]"); if (!el) return;
  var w = S.ws, first = Math.floor(Math.max(S.rec.pos, w.loopA - 1) / 4) * 4 + 1, bars = [];
  for (var i = first; i < first + 4 && i <= NBARS; i++) bars.push(i);
  var cnt = el.querySelector("[data-count]");
  el.innerHTML = staff(bars, SCORE_W, {loop:[w.loopA, w.loopB]}) + '<div class="ph" data-ph style="top:8px;height:58px"></div>' + (cnt ? cnt.outerHTML : "");
  el.dataset.first = bars[0];
}
var flashTimers = {};
function flashKey(m, dur){
  var k = phone.querySelector('[data-key="' + m + '"]'); if (!k) return;
  k.classList.add("hit"); clearTimeout(flashTimers[m]);
  flashTimers[m] = setTimeout(function(){ k.classList.remove("hit"); }, Math.max(120, dur * 900));
}
function drawDynamic(){
  var ph = phone.querySelector("[data-ph]"), w = S.ws, now = performance.now();
  if (S.view === "workspace"){
    _sysInit();
    var bars = wsSystem();
    if (ph){
      var show = w.playing || w.started, x = phX(bars, Math.min(SCORE_W, ph.parentNode.offsetWidth || SCORE_W), w.pos);
      var scale = (ph.parentNode.offsetWidth || SCORE_W) / SCORE_W;
      ph.style.display = show && x > 0 ? "block" : "none"; ph.style.left = (phX(bars, SCORE_W, w.pos) * scale) + "px";
      ph.classList.toggle("paused", !w.playing && w.started);
    }
    var tph = phone.querySelector("[data-tph]"); if (tph) tph.style.left = (w.pos / NBARS * 100) + "%";
    var tm = phone.querySelector("[data-time]"); if (tm) tm.textContent = fmt(barTime(w.pos, BPM)) + " / " + fmt(barTime(NBARS, BPM));
  }
  if (S.view === "record"){
    var r = S.rec, sc = phone.querySelector("[data-score]");
    var first = sc && sc.dataset.first ? Number(sc.dataset.first) : Math.floor(Math.max(r.pos, w.loopA - 1) / 4) * 4 + 1, rb = [];
    for (var i = first; i < first + 4 && i <= NBARS; i++) rb.push(i);
    if (ph){ ph.style.display = r.phase === "recording" ? "block" : "none"; ph.style.left = (phX(rb, SCORE_W, r.pos) * ((ph.parentNode.offsetWidth || SCORE_W) / SCORE_W)) + "px"; }
    var rt = phone.querySelector("[data-rtime]"); if (rt) rt.textContent = "Bar " + Math.min(w.loopB, Math.floor(r.pos) + 1) + " · " + fmt(barTime(Math.max(0, r.pos - (w.loopA - 1)), wsBpm()));
    var pr = phone.querySelector("[data-rprog]"); if (pr) pr.style.width = Math.max(0, (r.pos - (w.loopA - 1)) / (w.loopB - w.loopA + 1) * 100) + "%";
    animMeter(r.phase === "recording", now);
  }
  if (S.view === "drill" && S.drill){
    var d = S.drill, moving = d.playing || d.phase === "recording", rg = drillRange();
    if (ph){
      var showD = moving || (d.pos > rg.a && d.phase === "idle");
      ph.style.display = showD ? "block" : "none";
      ph.style.left = (phX([41, 42, 43], SCORE_W, d.pos) * ((ph.parentNode.offsetWidth || SCORE_W) / SCORE_W)) + "px";
      ph.classList.toggle("paused", !moving && d.pos > rg.a);
    }
    animMeter(d.phase === "recording", now);
  }
  if (S.view === "sync"){
    var aph = phone.querySelector("[data-aph]");
    if (aph){ aph.style.display = S.sync.playing ? "block" : "none"; aph.style.left = (S.sync.t * SYNC_PX) + "px"; }
  }
  if (S.view === "issue" && S.issue.playing){
    S.issue.t = (now - S.issue.start) / 1000;
    var cur = phone.querySelector("[data-cur]"), beats = S.issue.t / (60 / BPM);
    if (cur){ var xx = 34 + beats / 4 * (340 - 8 - 34); cur.setAttribute("x1", xx); cur.setAttribute("x2", xx); cur.style.display = beats <= 4 ? "" : "none"; }
    if (beats > 4.2){ S.issue.playing = null; render(); }
  }
}
function _sysInit(){ if (S._sysKey === undefined) S._sysKey = wsSystem()[0]; }
function animMeter(on, ts){
  var bars = phone.querySelectorAll("[data-meter] i");
  for (var i = 0; i < bars.length; i++){
    var v = on ? .45 + .4 * Math.sin(ts / 140 + i * .9) * Math.sin(ts / 530 + i * .4) : 0;
    bars[i].style.height = Math.round(4 + Math.max(0, v) * 20) + "px";
  }
}

/* ================= Events ================= */
function act(a, arg, el){
  var w = S.ws, d = S.drill;
  ac();
  switch (a){
    case "help": stopAll(); S.sheet = "tour"; S.tourStep = 0; render(); break;
    case "tour-next": S.tourStep++; render(); break;
    case "tour-prev": S.tourStep--; render(); break;
    case "tour-close": S.sheet = null; render(); break;
    case "toast-ok": S.toast = ""; render(); break;
    case "close": S.sheet = null; render(); break;
    // library
    case "clear-q": S.query = ""; render(); break;
    case "add": go("import"); break;
    case "open-song":
      if (arg === "viva") go("workspace");
      else { S.toast = "Only Viva La Vida is set up in this prototype. Tap + Add song, or open Viva La Vida."; render(); }
      break;
    // import
    case "cancel-import": go("library"); break;
    case "pick": S.pickKind = arg; S.sheet = "pick"; render(); break;
    case "pick-file":
      var f = S._pickFiles[Number(arg)];
      S.imp[S.pickKind] = {name:f.name, size:f.size, bad:!!f.bad};
      if (S.pickKind === "score" && !f.bad && !S.imp.title) S.imp.title = "Viva La Vida";
      S.sheet = null; render(); break;
    case "import-next": S.song = true; go("parts"); break;
    // parts
    case "to-import": go("import"); break;
    case "part": S.part = arg; render(); break;
    case "hear-part":
      var sh = PARTS.filter(function(p){ return p.id === arg; })[0].sh, t = 0;
      [1, 2].forEach(function(bar){ NOTES[bar].forEach(function(n){ tone(n[0] + sh, n[2] * 60 / BPM * .95, .22, 0, (bar - 1) * 240 / BPM + n[1] * 60 / BPM); }); });
      break;
    case "parts-next":
      if (S.part !== "T"){ S.toast = "This prototype follows the tenor part. Choose Tenor to continue."; render(); }
      else go("sync");
      break;
    // sync
    case "to-parts": go("parts"); break;
    case "nudge": S.sync.hist.push(S.sync.offset); S.sync.offset = Math.max(-5, Math.min(1, Math.round((S.sync.offset + Number(arg)) * 100) / 100)); render(); break;
    case "sync-play":
      S.sync.playing = !S.sync.playing;
      if (S.sync.playing) S.sync.t = 0;
      render(); break;
    case "sync-mark":
      S.sync.hist.push(S.sync.offset); S.sync.marker = S.sync.t;
      S.sync.offset = -Math.round(S.sync.t * 100) / 100; render(); break;
    case "sync-undo": if (S.sync.hist.length){ S.sync.offset = S.sync.hist.pop(); S.sync.marker = null; } render(); break;
    case "sync-done":
      if (Math.abs(S.sync.offset - SYNC_TRUE) > .12){ S.sync.hist.push(S.sync.offset); }
      go("workspace");
      if (Math.abs(S.sync.offset - SYNC_TRUE) > .12){ S.toast = "Synced with a " + Math.abs(S.sync.offset - SYNC_TRUE).toFixed(2) + " s gap. For this prototype, playback uses the correct alignment."; render(); }
      break;
    // workspace
    case "to-library": go("library"); break;
    case "ws-play":
      if (!w.started){ w.pos = w.loopA - 1; w.started = true; }
      w.playing = !w.playing; render(); break;
    case "ws-restart": w.pos = w.loopA - 1; render(); break;
    case "loop-toggle": w.loop = !w.loop; render(); break;
    case "ws-slower": w.tempo = Math.max(50, Math.ceil(w.tempo / 5) * 5 - 5); w.bpmError = ""; render(); break;
    case "ws-faster": w.tempo = Math.min(100, Math.floor(w.tempo / 5) * 5 + 5); w.bpmError = ""; render(); break;
    case "bpm-edit": if (arg === "ws"){ w.editingBpm = true; w.playing = false; } else { d.editingBpm = true; d.playing = false; } render(); break;
    case "bpm-done": commitBpm(arg, phone.querySelector("[data-bpm-input]").value); break;
    case "ws-metro": w.metro = !w.metro; render(); break;
    case "ws-kb": w.kb = !w.kb; render(); break;
    case "parts-sheet": S.sheet = "parts-vol"; render(); break;
    case "mute": w[arg + "Mute"] = !w[arg + "Mute"]; render(); break;
    case "ws-record":
      if (w.loopA !== 33 || w.loopB !== 48){ w.playing = false; S.sheet = "off-loop"; render(); }
      else startRecording();
      break;
    case "set-bridge-record": w.loopA = 33; w.loopB = 48; startRecording(); break;
    // record
    case "rec-end": finishRecording(); break;
    case "rec-cancel": S.recPaused = S.rec.phase; S.rec.phase = "idle"; S.sheet = "rec-cancel"; render(); break;
    case "rec-cancel-no": S.rec.phase = S.recPaused || "recording"; S.sheet = null; render(); break;
    case "rec-cancel-yes": go("workspace"); S.toast = "Recording deleted. Nothing was saved."; render(); break;
    // feedback
    case "to-workspace": go("workspace"); break;
    case "info": S.openInfo = S.openInfo === arg ? null : arg; render(); break;
    case "rerecord": w.loopA = 33; w.loopB = 48; startRecording(); break;
    case "save-take": S.cur.saved = !S.cur.saved; render(); break;
    case "ask-discard-take": S.sheet = "discard-take"; render(); break;
    case "discard-take":
      var gone = S.cur.n; S.takes = S.takes.filter(function(t){ return t !== S.cur; });
      S.takes.forEach(function(t, i){ t.n = i + 1; });
      S.cur = S.takes[S.takes.length - 1] || null;
      go("workspace"); S.toast = "Take " + gone + " discarded."; render(); break;
    case "to-issue": go("issue"); break;
    case "start-drill": if (!S.drill) S.drill = freshDrill(); go("drill"); break;
    case "to-feedback": ensureTake(); go("feedback"); break;
    // issue
    case "issue-play":
      if (S.issue.playing === arg){ S.issue.playing = null; render(); break; }
      S.issue.playing = arg; S.issue.start = performance.now();
      var beat = 60 / BPM;
      if (arg === "ref") NOTES[42].forEach(function(n){ tone(n[0], n[2] * beat * .95, .26, 0, n[1] * beat); });
      else youTake42().forEach(function(n){ tone(n.m, n.d * beat * .95, .26, n.det, n.s * beat); });
      render(); break;
    // drill
    case "to-drill": go("drill"); break;
    case "dr-play": d.playing = !d.playing; d.playingBack = false; render(); break;
    case "dr-record": startDrillRecording(); break;
    case "dr-end": endDrillTake(); break;
    case "dr-slower": d.tempo = Math.max(50, Math.ceil(d.tempo / 5) * 5 - 5); d.bpmError = ""; render(); break;
    case "dr-faster": d.tempo = Math.min(100, Math.floor(d.tempo / 5) * 5 + 5); d.bpmError = ""; render(); break;
    case "dr-guidance": d.guidance = !d.guidance; render(); break;
    case "dr-choice": d.choice = arg; render(); break;
    case "dr-apply":
      d.sheet = null; d.misses = 0; d.streak = 0; d.pos = 0;
      if (d.choice === "beats"){ d.chunk = 0; d.msg = "Beat 1 on its own: the jump up to the high E and F. Sing just that beat."; }
      else if (d.choice === "slow"){ d.tempo = 80; d.msg = "Slowed to 80%. Get one clean and I'll speed it back up."; }
      else { d.guidance = true; d.msg = "Guidance is back on. Follow the count-in and the pitch line."; }
      render(); break;
    case "dr-playback":
      d.playingBack = !d.playingBack; d.playing = false;
      if (d.playingBack){
        var lt = d.takes[d.takes.length - 1], bs = 60 / drillBpm();
        var c = lt.chunk !== null ? CHUNKS[lt.chunk] : {a:0, b:4};
        NOTES[42].forEach(function(n){ if (n[1] >= c.a && n[1] < c.b) tone(n[0], n[2] * bs * (lt.clean ? .95 : .6), .24, lt.clean ? 0 : (lt.reason === "pitch" ? -40 : 0), (n[1] - c.a) * bs * (lt.clean || lt.reason !== "timing" ? 1 : .85)); });
        clearTimeout(S._pbT); S._pbT = setTimeout(function(){ if (S.drill){ S.drill.playingBack = false; if (S.view === "drill") render(); } }, (c.b - c.a) * bs * 1000 + 200);
      }
      render(); break;
    case "dr-ask-discard": d.sheet = "discard"; d.playingBack = false; render(); break;
    case "dr-close": d.sheet = null; render(); break;
    case "dr-discard":
      var u = JSON.parse(d.undo), n = d.takes.length;
      for (var k in u) d[k] = u[k];
      d.undo = null; d.sheet = null; S.session.drillTakes = Math.max(0, S.session.drillTakes - 1);
      S.toast = "Take #" + n + " discarded. It no longer counts toward the goal."; render(); break;
    case "dr-reset": S.drill = freshDrill(); render(); break;
    // complete / summary
    case "to-complete": if (S.session.mastered.indexOf(42) < 0) S.session.mastered.push(42); go("complete"); break;
    case "next-problem": w.loopA = 37; w.loopB = 40; w.pos = 36; w.started = false; w.tempo = 50; go("workspace"); S.toast = "Loop set to bars 37–40 at half speed, around bar 38."; render(); break;
    case "repeat-drill": S.drill = freshDrill(); go("drill"); break;
    case "end-session": go("summary"); break;
    case "done": go("library"); break;
  }
}
function commitBpm(which, raw){
  var n = Number(raw), o = which === "ws" ? S.ws : S.drill;
  if (!raw || isNaN(n) || n < 69 || n > 138){ o.bpmError = "Enter a tempo from 69 to 138 BPM (half to full speed)."; render(); return; }
  o.tempo = Math.round(n / BPM * 100); o.editingBpm = false; o.bpmError = ""; render();
}

phone.addEventListener("click", function(e){
  var k = e.target.closest("[data-key]");
  if (k){ ac(); var m = Number(k.dataset.key); tone(m, .6, .3); flashKey(m, .5); return; }
  var el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  act(el.getAttribute("data-act"), el.getAttribute("data-arg"), el);
});
phone.addEventListener("input", function(e){
  var t = e.target, k = t.getAttribute("data-input");
  if (k === "query"){ S.query = t.value; var pos = t.selectionStart; render(); var q = document.getElementById("q"); if (q){ q.focus(); q.setSelectionRange(pos, pos); } }
  else if (k === "title"){ S.imp.title = t.value; S.imp.titleTouched = true;
    var p = t.selectionStart; render(); var ti = document.getElementById("title"); if (ti){ ti.focus(); ti.setSelectionRange(p, p); }
  }
  else if (k === "sync-off"){
    S.sync.offset = Number(t.value);
    var aud = phone.querySelector("[data-aud]"); if (aud) aud.style.transform = "translateX(" + (40 + S.sync.offset * SYNC_PX) + "px)";
    var o = phone.querySelector("[data-off]"); if (o) o.textContent = (S.sync.offset <= 0 ? "−" : "+") + Math.abs(S.sync.offset).toFixed(2) + " s";
    var st = phone.querySelector("[data-sync-status]"), ok2 = Math.abs(S.sync.offset - SYNC_TRUE) <= .12;
    if (st){ st.className = "badge " + (ok2 ? "g" : "o"); st.innerHTML = ok2 ? I.tick(12) + "Lined up" : "Not lined up yet"; }
  }
  else if (k === "vol-tenor" || k === "vol-others"){
    var which = k.slice(4); S.ws[which + "Vol"] = Number(t.value);
    var out = phone.querySelector('[data-vol-out="' + which + '"]'); if (out) out.textContent = t.value + "%";
  }
});
phone.addEventListener("change", function(e){
  var k = e.target.getAttribute("data-input");
  if (k === "sync-off"){ S.sync.hist.push(S.sync._before !== undefined ? S.sync._before : S.sync.offset); S.sync._before = undefined; render(); }
  if (k === "vol-tenor" || k === "vol-others") render();
});
phone.addEventListener("pointerdown", function(e){
  if (e.target.matches && e.target.matches('[data-input="sync-off"]')) S.sync._before = S.sync.offset;
  var hd = e.target.closest("[data-hd]"); if (!hd) return;
  e.preventDefault(); ac();
  var tl = phone.querySelector("[data-tl]"), which = hd.dataset.hd;
  hd.setPointerCapture(e.pointerId);
  function move(ev){
    var r = tl.getBoundingClientRect(), x = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    var w = S.ws;
    if (which === "a"){ w.loopA = Math.max(1, Math.min(w.loopB, Math.round(x * NBARS) + 1)); }
    else { w.loopB = Math.max(w.loopA, Math.min(NBARS, Math.round(x * NBARS))); }
    if (w.pos < w.loopA - 1 || w.pos > w.loopB){ w.pos = w.loopA - 1; }
    updateLoopUI();
  }
  function up(){ hd.removeEventListener("pointermove", move); hd.removeEventListener("pointerup", up); hd.removeEventListener("pointercancel", up); render(); }
  hd.addEventListener("pointermove", move); hd.addEventListener("pointerup", up); hd.addEventListener("pointercancel", up);
});
phone.addEventListener("keydown", function(e){
  var t = e.target;
  if (t.matches("[data-bpm-input]")){
    if (e.key === "Enter") commitBpm(t.getAttribute("data-bpm-input"), t.value);
    if (e.key === "Escape"){ var o = t.getAttribute("data-bpm-input") === "ws" ? S.ws : S.drill; o.editingBpm = false; o.bpmError = ""; render(); }
  }
  if (t.matches("[data-hd]") && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    var w = S.ws, dlt = e.key === "ArrowLeft" ? -1 : 1;
    if (t.dataset.hd === "a") w.loopA = Math.max(1, Math.min(w.loopB, w.loopA + dlt)); else w.loopB = Math.max(w.loopA, Math.min(NBARS, w.loopB + dlt));
    e.preventDefault(); render(); var nh = phone.querySelector('[data-hd="' + t.dataset.hd + '"]'); if (nh) nh.focus();
  }
});
function updateLoopUI(){
  var w = S.ws, bpm = wsBpm();
  var sel = phone.querySelector("[data-sel]"); if (sel){ sel.style.left = ((w.loopA - 1) / NBARS * 100) + "%"; sel.style.width = ((w.loopB - w.loopA + 1) / NBARS * 100) + "%"; }
  var ha = phone.querySelector('[data-hd="a"]'), hb = phone.querySelector('[data-hd="b"]');
  if (ha) ha.style.left = ((w.loopA - 1) / NBARS * 100) + "%"; if (hb) hb.style.left = (w.loopB / NBARS * 100) + "%";
  var lb = phone.querySelector("[data-loop-bars]"); if (lb) lb.textContent = "Bars " + w.loopA + "–" + w.loopB;
  var li = phone.querySelector("[data-loop-info]"); if (li) li.textContent = loopLabel(w.loopA, w.loopB) + " · " + fmt(barTime(w.loopA - 1, bpm)) + "–" + fmt(barTime(w.loopB, bpm));
}
guide.addEventListener("click", function(e){
  var el = e.target.closest("[data-gact]"); if (!el) return;
  var a = el.dataset.gact, arg = el.dataset.arg;
  if (a === "jump") seedTo(arg);
  if (a === "variant"){ S.variant = arg; S.drill = freshDrill(); if (S.view === "drill") render(); else renderGuide(); }
  if (a === "reset"){ stopAll(); var v = S.variant; S = fresh(); S.variant = v; T0 = Date.now(); go("library"); }
});
window.addEventListener("resize", function(){ if (S.sheet === "tour") placeTour(); });
window.addEventListener("hashchange", function(){ var v = (location.hash || "").slice(1); if (SCREENS[v] && v !== S.view) seedTo(v); });

/* ================= Boot ================= */
var h0 = (location.hash || "").slice(1);
if (h0 && SCREENS[h0] && h0 !== "library") seedTo(h0); else render();
requestAnimationFrame(tick);
})();
</script>
