<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<meta charset="utf-8">
<title>ResoNote Prototype 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap" rel="stylesheet">
<!--
  ResoNote Iteration 2 high-fidelity prototype (Prototype 2.0), G1T2.
  Built 26 Oct 2026 from the Iter1.4 low-fidelity prototype (16 views) and the
  21 Oct "ResoNote Hi-Fi Drill (HE fixes).html". Follows the Iter2.02 easy scenario:
  Clarence imports "Viva La Vida", picks tenor, fixes a 2-bar count-in offset, loops
  the bridge (bars 33-48) at half speed, records it, and drills bar 42.
  Simulated: file picker, audio-to-score sync, pitch detection, microphone input level,
  AI coach scores and drill results (scripted, the same on every run). Reference audio is
  a Web Audio synth of the tenor line.
  26 Oct UX checklist pass: Confirm sync warns when the track is still off; bar strip uses symbols
  as well as colour; 44px tap targets; larger type; light mode only; one record label ("Record take");
  count-in shows "Get ready"; microphone pre-prompt before the first take.
  26 Oct UI/UX audit pass: score is the hero (bigger staff on a paper band, 2-3 lines); Take Feedback leads
  with "Fix this first"; one colour rule (green good, amber check, orange fix first, blue actions);
  Cancel button on Recording; sync slider centred on 0; sentence-case headings; flat lists.
  LLM declaration: AI-drafted (Claude). The team must run the scenario on a phone-sized
  screen and check every label against Iter2.02, Iter2.03 and Iter2.04 before submitting.
-->
<style>
/* Layout: a phone-sized app on the left, a "prototype guide" rail on the right (stacks below on phones). */
:root{
  --page:#E7E5DE; --bg:#F4F3EE; --card:#FFFFFF; --sunk:#F2F1EC; --ink:#17181C; --muted:#5B5E66;
  --line:#E2E0D8; --line2:#D2CFC5; --staff:#8F929A;
  --blue:#2F45C6; --blue-soft:#E8EBFA; --blue-ink:#22339A; --on-accent:#FFFFFF;
  --orange:#C2570F; --orange-soft:#FBEADF; --orange-ink:#8A3A0C;
  --red:#B42318; --red-soft:#FBE4E1; --green:#1E7B4A; --green-soft:#E1F2E8;
  --amber:#865C00; --amber-soft:#FBF1D6; --amber-bar:#B98400; --scrim:rgba(23,24,28,.48); --spot:#FFB547;
  --sec-a:#ECEAE3; --sec-b:#E3E1D9; --wave:#B8B5AB;
  --edge:#80838B; /* 3:1+ boundary for inputs, switch tracks and radios (WCAG 1.4.11) */
  --pw:402px; --ph:830px;
  --f-serif:"Young Serif",Georgia,"Times New Roman",serif; /* greeting and headings only; one weight (400) */
  --f-ui:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light; /* the app is light-only, whatever the OS theme */
}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:15px/1.4 var(--f-ui);padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;max-width:1120px;margin:0 auto}

/* ---------- Guide rail ---------- */
.guide{width:360px;max-width:100%;display:flex;flex-direction:column;gap:14px;min-width:0}
.guide h1{font-family:var(--f-serif);font-weight:400;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.guide .lede{margin:0;color:var(--muted);font-size:13px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.gcard h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.vlist{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.vlist button{width:100%;display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 8px}
.vlist button:hover{background:var(--sunk)}
.vlist button[aria-current="true"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:700}
.vlist .n{font-variant-numeric:tabular-nums;color:var(--muted);width:18px;flex:none;font-size:12px}
.vlist button[aria-current="true"] .n{color:var(--blue-ink)}
.gnow .vn{font-family:var(--f-serif);font-size:17px;font-weight:400}
.gnow p{margin:0;font-size:13px}
.gnow dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:6px 10px;font-size:13px}
.gnow dt{color:var(--muted);font-weight:600}
.gnow dd{margin:0;min-width:0}
.gnow ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.he{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--orange-soft);color:var(--orange-ink);margin-right:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 6px;font-size:13px;font-weight:600;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-accent)}
.gsmall{font-size:12px;color:var(--muted);margin:0}
.grow{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}

/* ---------- Phone ---------- */
.phone{width:var(--pw);height:var(--ph);max-width:100%;border-radius:46px;overflow:hidden;position:relative;background:var(--bg);
  box-shadow:0 0 0 12px var(--ink),0 0 0 13px #3A3C42,0 22px 48px rgba(0,0,0,.22);display:flex;flex-direction:column;flex:none;
  transform:scale(var(--s,1));transform-origin:top left;margin:13px}
/* screen is 402 x 830 pt: iPhone 16 Pro width; with the 12px bezel the frame is about 2:1, like a real iPhone body */
.phone-box{flex:none;width:calc((var(--pw) + 26px) * var(--s,1));height:calc((var(--ph) + 26px) * var(--s,1))}
@media (max-width:480px){
  .phone-box{width:100%;height:auto}
  .phone{width:100%;height:calc(100svh - 40px);min-height:640px;border-radius:22px;box-shadow:0 0 0 1px var(--line2);transform:none;margin:0}
  .wrap{gap:24px}
}
.scr{display:flex;flex-direction:column;height:100%;min-height:0}
.hdr{height:56px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 6px;flex:none}
.hdr .ttl{text-align:center;min-width:0}
.hdr .ttl b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl span{display:block;font-size:13px;color:var(--muted)}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--sunk)}
.body{padding:2px 18px 14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.ftr{padding:10px 18px 22px;display:flex;gap:10px;align-items:center;flex:none;border-top:1px solid var(--line);background:var(--bg)}
.ftr.col{flex-direction:column;align-items:stretch}
.ftr.col .btn{flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:12px 14px}
.h1{font-family:var(--f-serif);font-size:23px;font-weight:400;margin:4px 0 0;line-height:1.2;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:15px}
.sub{font-size:14px;color:var(--muted)}
.lbl{font-size:15px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* section heading: sentence case, no tracking (the old tracked ALL-CAPS label read as template chrome) */
.eyebrow{font-size:15px;font-weight:700;color:var(--ink)}
/* flat section on the page background, used instead of a card for lists */
.sect{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px}
/* the score is printed on a full-width "paper" band, the one surface that isn't a card */
.paper{margin:0 -18px;background:var(--card);border-block:1px solid var(--line);padding:4px 18px 10px;display:flex;flex-direction:column;gap:2px}
.paper .scap{padding:6px 0 0}
.tbtn{min-height:44px;border:0;background:transparent;padding:0 8px;font-size:15px;font-weight:700;color:var(--ink);border-radius:10px}
.tbtn:hover{background:var(--sunk)}
.hdr.wide{grid-template-columns:84px 1fr 84px}
.hdr.wide .tbtn{justify-self:start}
.hdr.wide .ib{justify-self:end}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.seg3 button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px}
.tnum{font-variant-numeric:tabular-nums}

/* step indicator (HE #15) */
.steps3{display:flex;flex-direction:column;gap:6px}
.steps3 .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps3 .bars i{height:5px;border-radius:3px;background:var(--line)}
.steps3 .bars i.on{background:var(--blue)}

/* buttons */
.btn{height:54px;border-radius:16px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;border:0;padding:0 16px}
.btn.pri{flex:1;background:var(--blue);color:var(--on-accent)}
.btn.rec{flex:1;background:var(--blue);color:var(--on-accent)}
.btn.stop{flex:1;background:var(--ink);color:var(--bg)}
.btn.sec{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:15px;font-weight:600}
.btn.ghost{border:1.5px solid var(--blue);background:transparent;color:var(--blue-ink);font-size:15px;font-weight:700}
.btn.danger{background:var(--red);color:var(--on-accent)}
.btn.full{width:100%}
.btn:disabled,.mini:disabled,.sbtn:disabled{opacity:.42;cursor:not-allowed}
.dot{width:12px;height:12px;border-radius:50%;background:currentColor}
.sq{width:12px;height:12px;border-radius:2px;background:currentColor}
.mini{height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.mini.on{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.mini.danger{color:var(--red)}
.link{border:0;background:none;color:var(--blue-ink);font-weight:700;padding:4px 0;font-size:14px;min-height:44px;display:inline-flex;align-items:center}

/* chips & badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.o{background:var(--orange-soft);color:var(--orange-ink)}
.badge.b{background:var(--blue-soft);color:var(--blue-ink)}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.a{background:var(--amber-soft);color:var(--amber)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:600}
.chip.clean{background:var(--green-soft);color:var(--green)}
.chip.miss{background:var(--orange-soft);color:var(--orange-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px}

/* switches */
.switch{display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;padding:0}
.switch .word{font-size:14px;font-weight:700;width:28px;text-align:right}
.track{width:46px;height:28px;border-radius:999px;position:relative;display:inline-block;background:var(--edge);transition:background .15s}
.track.on{background:var(--blue)}
.knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.track.on .knob{left:21px}
.set-row{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:8px}
.set-row+.set-row{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.sbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:20px;line-height:1}
.bpm-btn{min-width:96px;height:44px;border:1px dashed var(--edge);border-radius:10px;background:var(--card);padding:0 6px;font-variant-numeric:tabular-nums}
.bpm-btn b{font-size:16px}
.bpm-btn span{font-size:12px;color:var(--muted)}
.bpm-edit{display:flex;gap:6px;align-items:center}
.bpm-edit input{width:70px;height:44px;border:2px solid var(--blue);border-radius:10px;text-align:center;font-size:16px;background:var(--card)}
.bpm-edit .done{height:44px;padding:0 12px;border-radius:10px;border:0;background:var(--blue);color:var(--on-accent);font-weight:700}
.err{font-size:13px;color:var(--red);font-weight:600}
.req{font-size:12px;font-weight:700;color:var(--red);margin-left:6px}
.file .ft .req{display:inline;color:var(--red);font-size:12px}
.field label.has-req{justify-content:flex-start}
.sheet .btn{flex:none}
input[type=range]{width:100%;margin:0;height:44px;background:transparent;-webkit-appearance:none;appearance:none;--p:50%}
input[type=range]:disabled{opacity:.35;cursor:not-allowed}
.ib.lab{flex-direction:column;gap:1px;width:60px;height:54px;border:1px solid var(--line2);border-radius:16px;font-size:11px;font-weight:700;color:var(--ink)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--blue) var(--p),var(--line2) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--blue)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--blue)}

/* score */
.score{position:relative;margin:0 auto;overflow:hidden}
.score svg{display:block;max-width:100%;height:auto}
.stf .ln{stroke:var(--staff);stroke-width:1}
.stf .bl{stroke:var(--ink);stroke-width:1.3}
.stf .nh{fill:var(--ink);stroke:var(--ink);stroke-width:1.3}
.stf .nh.o{fill:var(--card)}
.stf .st{stroke:var(--ink);stroke-width:1.3}
.stf .bm{fill:var(--ink)}
.stf .num{fill:var(--muted);font:600 11px var(--f-ui)}
.stf .num.on{fill:var(--blue-ink)}
.stf .hl-loop{fill:var(--blue-soft)}
.stf .hl-focus{fill:var(--orange-soft)}
.stf .hl-sel{fill:none;stroke:var(--orange);stroke-width:1.5;stroke-dasharray:3 3}
.stf .dim{fill:var(--card);opacity:.78}
.stf .gd{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:4 4;stroke-linecap:round}
.stf .gn{fill:var(--blue);font:700 11px var(--f-ui)}
.stf .rest{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.stf .nm{fill:var(--blue-ink);font:700 10px var(--f-ui)}
.score+.score{margin-top:2px}
.ph{position:absolute;width:2px;background:var(--blue);pointer-events:none;display:none}
.ph.paused{background:repeating-linear-gradient(var(--blue) 0 6px,transparent 6px 10px)}
.scap{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0;font-size:13px;min-height:28px}
.recl{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:700}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* loop timeline (Change 3, HE #4) */
.tl{position:relative;height:74px;margin:4px 6px 0;touch-action:none;user-select:none}
.tl .secs{position:absolute;left:0;right:0;top:0;height:20px}
.tl .sec{position:absolute;top:0;height:20px;font-size:11px;font-weight:700;color:var(--muted);padding:3px 0 0 4px;white-space:nowrap;overflow:hidden;border-left:1px solid var(--line2)}
.tl .wv{position:absolute;left:0;right:0;top:22px;height:40px;border-radius:6px;background:var(--sunk);overflow:hidden}
.tl .wv svg{width:100%;height:100%;display:block}
.tl .wv rect{fill:var(--wave)}
.tl .sel{position:absolute;top:20px;height:44px;background:rgba(47,69,198,.16);border:2px solid var(--blue);border-radius:6px;pointer-events:none}
.tl .hd{position:absolute;top:16px;width:44px;height:52px;margin-left:-22px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;cursor:ew-resize}
.tl .hd i{width:14px;height:44px;border-radius:5px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tl .hd i::after{content:"";width:2px;height:16px;border-left:1px solid var(--on-accent);border-right:1px solid var(--on-accent);opacity:.8}
.tl .tph{position:absolute;top:20px;height:44px;width:2px;background:var(--ink);pointer-events:none}
.tl .ax{position:absolute;left:0;right:0;bottom:0;height:12px;font-size:11px;color:var(--muted)}
.tl .ax span{position:absolute;transform:translateX(-50%)}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.readout b{font-size:15px}

/* keyboard (HE #18) */
.kbwrap{display:flex;flex-direction:column;gap:4px}
.kbscroll{overflow-x:auto;border-radius:10px;border:1px solid #8F929A;-webkit-overflow-scrolling:touch}
.kb{position:relative;height:110px;display:flex;width:max-content;background:#FAFAF7}
.kb .w{flex:none;width:44px;position:relative;border:0;border-right:1px solid #C9C7BF;background:#FAFAF7;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:10px;font-weight:700;color:#5B5E66}
.kb .w:last-child{border-right:0}
.kb .w.hit{background:#DDE2FB;color:#22339A}
.kb .k{position:absolute;top:0;width:28px;height:60%;background:#17181C;border:0;border-radius:0 0 4px 4px;padding:0}
.kb .k.hit{background:#2F45C6}
.kb .w.mid::before{content:"";position:absolute;bottom:22px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#2F45C6}
.kb .w.mid{color:#22339A}
.kbkey{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kbkey i{width:8px;height:8px;border-radius:50%;background:#2F45C6;display:inline-block}

/* meter (HE #9) */
.meter{display:flex;align-items:center;gap:10px}
.meter .bars{display:flex;align-items:flex-end;gap:3px;height:26px;flex:none}
.meter .bars i{display:block;width:5px;border-radius:2px;background:var(--green);height:4px}
.meter .lvl{font-size:13px;font-weight:700;color:var(--green);margin-left:auto;text-align:right}
.meter .lvl.wait{color:var(--muted)}

/* lists */
.song{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:16px;text-align:left;width:100%}
.song .art{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.song .meta{flex:1;min-width:0}
.song .meta b{display:block;font-size:15px}
.song .meta span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 4px 10px}
.greet h1{margin:0;display:flex;align-items:center;justify-content:center;gap:10px;font:400 27px/1.15 var(--f-serif);letter-spacing:-.01em;text-wrap:balance}
.greet h1 svg{flex:none;color:var(--orange)}
.greet h1 svg rect{animation:hum 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.greet h1 svg rect:nth-child(2){animation-delay:.2s}.greet h1 svg rect:nth-child(3){animation-delay:.4s}
@keyframes hum{50%{transform:scaleY(.55)}}
.greet p{margin:0;font-size:13px;color:var(--muted)}
.lib-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 2px -2px}
.search{display:flex;align-items:center;gap:8px;height:46px;border:1px solid var(--edge);border-radius:14px;padding:0 12px;background:var(--card)}
.search input{border:0;background:transparent;flex:1;min-width:0;height:100%;font-size:15px;outline:none}

var SYNC_TRUE = -2 * 240 / BPM;   // -3.478 s
var SYNC_PX = 22;                 // pixels per second in the sync view
// Learning-track waveform: count-in clicks (orange spikes) then the sung tenor notes (attack, sustain with a little
// wobble, release). Same shape every run.
function syncWave(){
  var beat = 60 / BPM, end = -SYNC_TRUE + 4 * 240 / BPM, W = Math.ceil(end * SYNC_PX) + 4, H = 40, mid = H / 2, step = 1.5;
  var notes = [];
  for (var bb = 1; bb <= 4; bb++) NOTES[bb].forEach(function(n){ notes.push({t:-SYNC_TRUE + (bb - 1) * 240 / BPM + n[1] * beat, d:n[2] * beat * .8, m:n[0]}); });
  var c = "", v = "";
  for (var x = 0; x < W; x += step){
    var t = x / SYNC_PX, a = 0, click = false;
    for (var k = 0; k < 8; k++){ var dt = t - k * beat; if (dt >= 0 && dt < .14){ a = Math.max(a, (k % 4 === 0 ? 1 : .7) * Math.exp(-dt * 22)); click = true; } }
    notes.forEach(function(n){
      var dt = t - n.t; if (dt < 0 || dt > n.d + .06) return;
      var env = dt < .03 ? dt / .03 : dt > n.d ? 1 - (dt - n.d) / .06 : .8 + .2 * Math.exp(-(dt - .03) * 6);
      a = Math.max(a, env * (.55 + .03 * (n.m - 52)) * (.85 + .15 * Math.sin(x * 1.7 + n.m)));
    });
    if (a < .04) continue;
    var hh = Math.max(2, a * (H - 2)), r = '<rect x="' + x + '" y="' + (mid - hh / 2).toFixed(1) + '" width="1.1" height="' + hh.toFixed(1) + '" rx=".7"/>';
    if (click) c += r; else v += r;
  }
  return '<svg class="wf" width="' + W + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><g class="c">' + c + '</g><g class="v">' + v + '</g></svg>';
}
function syncStatus(off){
  var err = Math.abs(off - SYNC_TRUE);

}

/* ================= Drill logic ================= */
function drillSnapshot(){ var d = S.drill; return JSON.stringify({tempo:d.tempo, guidance:d.guidance, chunk:d.chunk, takes:d.takes, streak:d.streak, misses:d.misses, targetTries:d.targetTries, msg:d.msg, last:d.last}); }

function judgeDrill(){
  // Scripted: the first 2 takes at the goal settings (whole bar, 100%, guidance off) are missed.
  var d = S.drill, atTarget = d.tempo >= 100 && !d.guidance && d.chunk === null;
  if (atTarget && d.targetTries < 2) return {clean:false, reason: d.targetTries === 0 ? "pitch" : "timing", atTarget:true};

}
function markDrill(){

  d.takes = d.takes.concat([take]); d.phase = "idle"; S.session.drillTakes++;

  if (r.clean){
    d.misses = 0;

    }

/* ================= Animation loop ================= */
var lastTs = null;
function tick(ts){
  var dt = lastTs === null ? 0 : Math.min(.1, (ts - lastTs) / 1000); lastTs = ts;
  var w = S.ws;
  // workspace playback
  if (S.view === "workspace" && w.playing){
    var prevBar = Math.floor(w.pos);
    var tr = {pos:w.pos, a:w.loop ? w.loopA - 1 : 0, b:w.loop ? w.loopB : NBARS, loop:true, bpm:wsBpm()};
    if (!w.loop && w.pos < tr.a) tr.a = 0;
    var ended = advance(tr, dt, function(n, bar, barSec){
      if (!w.tenorMute) tone(n[0], n[2] / 4 * barSec * .95, .22 * w.tenorVol / 100);
      flashKey(n[0], n[2] / 4 * barSec);
    }, function(k, bar){
      if (w.metro) click(k === 0);
      if (k === 0 && !w.othersMute) chord(bar, .2 * w.othersVol / 100);
    });
    w.pos = tr.pos;
    if (!w.loop && w.pos >= w.loopB){ w.pos = w.loopB; }
    if (wsSystemKey() !== S._sysKey) refreshScore();
  }
  // passage recording
  if (S.view === "record" && S.rec.phase !== "judging" && S.rec.phase !== "idle"){
    var r = S.rec, beatSec = 60 / wsBpm();
    if (r.phase === "countin"){
      r.t += dt;
      var cb = Math.floor(r.t / beatSec);
      if (cb !== r.countBeat){ r.countBeat = cb; if (cb < 4){ click(false); var ce = phone.querySelector("[data-count]"); if (ce) ce.textContent = cb + 1; } }
      if (r.t >= beatSec * 4){ r.phase = "recording"; render(); }
    } else {
      var rtr = {pos:r.pos, a:w.loopA - 1, b:w.loopB, loop:false, bpm:wsBpm()};
      var done = advance(rtr, dt, function(n, bar, barSec){ tone(n[0], n[2] / 4 * barSec * .95, .08); }, function(k, bar){ if (k === 0) chord(bar, .06); });
      r.pos = rtr.pos;
      if (Math.floor(r.pos / 4) !== S._recSys){ S._recSys = Math.floor(r.pos / 4); refreshRecScore(); }
      if (done) finishRecording();
    }
  }
  // judging progress
  if (S.sheet === "judging" || (S.drill && S.drill.phase === "judging" && S.view === "drill")){
    S.judgeT = (S.judgeT || 0) + dt;
    var jb = phone.querySelector("[data-judge]"); if (jb) jb.style.width = Math.min(100, S.judgeT / 1.4 * 100) + "%";
    if (S.judgeT >= 1.4){
      S.judgeT = 0;
      if (S.sheet === "judging"){ S.sheet = null; S.rec.phase = "idle"; addTake(Math.round(S._len)); S.openInfo = null; S.view = "feedback"; render(); var b = bodyEl(); if (b) b.scrollTop = 0; try { history.replaceState(null, "", "#feedback"); } catch(e){} }
      else markDrill();
    }
  }
  // drill playback / recording
  if (S.view === "drill" && S.drill){
    var d = S.drill, dbpm = drillBpm(), rg = drillRange();
    if (d.phase === "countin"){
      d.countT += dt; var db = Math.floor(d.countT / (60 / dbpm));
      if (db !== d.countBeat){ d.countBeat = db; if (db < 4){ click(false); var dce = phone.querySelector("[data-count]"); if (dce) dce.textContent = db + 1; } }
      if (d.countT >= 4 * 60 / dbpm){ d.phase = "recording"; render(); }
    } else if (d.phase === "recording" || d.playing){
      if (d.pos < rg.a || d.pos >= rg.b) d.pos = rg.a;
      var dtr = {pos:d.pos, a:rg.a, b:rg.b, loop:d.phase !== "recording", bpm:dbpm};
      var fin = advance(dtr, dt, function(n, bar, barSec){
        if (bar !== 42) return;
        if (d.playing || d.guidance) tone(n[0], n[2] / 4 * barSec * .95, d.playing ? .24 : .08);
      }, null);
      d.pos = dtr.pos;
      var rt = phone.querySelector("[data-rtime]"); if (rt) rt.textContent = Math.max(0, (d.pos - rg.a) * 240 / dbpm).toFixed(1);

    }

    for (var bb = 1; bb <= 4; bb++) NOTES[bb].forEach(function(n){ var nt = -SYNC_TRUE + (bb - 1) * 240 / BPM + n[1] * beat; if (nt >= prevT && nt < y.t) tone(n[0], n[2] * beat * .95, .22); });
    if (y.t > -SYNC_TRUE + 4 * 240 / BPM){ y.playing = false; render(); }
  }

}

function drawDynamic(){

    for (var i = first; i < first + 4 && i <= NBARS; i++) rb.push(i);

    var rt = phone.querySelector("[data-rtime]"); if (rt) rt.textContent = "Bar " + Math.min(w.loopB, Math.floor(r.pos) + 1) + " · " + fmt(barTime(Math.max(0, r.pos - (w.loopA - 1)), wsBpm()));
    var pr = phone.querySelector("[data-rprog]"); if (pr) pr.style.width = Math.max(0, (r.pos - (w.loopA - 1)) / (w.loopB - w.loopA + 1) * 100) + "%";
    animMeter(r.phase === "recording", now);
  }
  if (S.view === "drill" && S.drill){
    var d = S.drill, moving = d.playing || d.phase === "recording", rg = drillRange();
    if (ph){
      var showD = moving || (d.pos > rg.a && d.phase === "idle");
      ph.style.display = showD ? "block" : "none";
      ph.style.left = (phX([41, 42, 43], SCORE_W, d.pos) * ((ph.parentNode.offsetWidth || SCORE_W) / SCORE_W)) + "px";
      ph.classList.toggle("paused", !moving && d.pos > rg.a);
    }
    animMeter(d.phase === "recording", now);
  }
  if (S.view === "sync"){
    var aph = phone.querySelector("[data-aph]");
    if (aph){ aph.style.display = S.sync.playing ? "block" : "none"; aph.style.left = (S.sync.t * SYNC_PX) + "px"; }
  }
  if (S.view === "issue" && S.issue.playing){
    S.issue.t = (now - S.issue.start) / 1000;
    var cur = phone.querySelector("[data-cur]"), beats = S.issue.t / (60 / BPM), ps = S.issue.passes || [{off:0, a:0, b:4}], at = null;
    ps.forEach(function(q){ if (beats >= q.off && beats <= q.off + (q.b - q.a)) at = q.a + beats - q.off; });
    if (cur){ var xx = 34 + (at || 0) / 4 * (340 - 8 - 34); cur.setAttribute("x1", xx); cur.setAttribute("x2", xx); cur.style.display = at === null ? "none" : ""; }
    var last = ps[ps.length - 1];

}
function _sysInit(){ if (S._sysKey === undefined) S._sysKey = wsSystem()[0]; }
function animMeter(on, ts){
  var bars = phone.querySelectorAll("[data-meter] i");
  for (var i = 0; i < bars.length; i++){
    var v = on ? .45 + .4 * Math.sin(ts / 140 + i * .9) * Math.sin(ts / 530 + i * .4) : 0;
    bars[i].style.height = Math.round(4 + Math.max(0, v) * 20) + "px";
  }
}

/* ================= Events ================= */
function act(a, arg, el){
  var w = S.ws, d = S.drill;
  ac();
  switch (a){
    case "help": stopAll(); S.sheet = "tour"; S.tourStep = 0; render(); break;
    case "tour-next": S.tourStep++; render(); break;
    case "tour-prev": S.tourStep--; render(); break;
    case "tour-close": S.sheet = null; render(); break;
    case "toast-ok": S.toast = ""; render(); break;
    case "close": S.sheet = null; render(); break;
    // library
    case "clear-q": S.query = ""; render(); break;
    case "add": go(S.setupAt || "import"); break;
    case "open-song":
      if (arg === "viva") go("workspace");
      else { S.toast = "Only Viva La Vida works in this prototype."; render(); }
      break;
    // import
    case "close-setup":
      S.setupAt = S.view; go("library");
      if (S.setupAt !== "import" || S.imp.score){ S.toast = "Setup saved. Tap the song to finish."; render(); }
      break;
    case "pick": S.pickKind = arg; S.sheet = "pick"; render(); break;
    case "pick-file":
      var f = S._pickFiles[Number(arg)];
      S.imp[S.pickKind] = {name:f.name, size:f.size, bad:!!f.bad};
      if (S.pickKind === "score" && !f.bad && !S.imp.title) S.imp.title = "Viva La Vida";
      S.sheet = null; render(); break;
    case "import-next": go("parts"); break;
    // parts
    case "to-import": go("import"); break;
    case "part": S.part = arg; render(); break;
    case "hear-part":
      var sh = PARTS.filter(function(p){ return p.id === arg; })[0].sh, t = 0;
      [1, 2].forEach(function(bar){ NOTES[bar].forEach(function(n){ tone(n[0] + sh, n[2] * 60 / BPM * .95, .22, 0, (bar - 1) * 240 / BPM + n[1] * 60 / BPM); }); });
      break;
    case "parts-next":
      if (S.part !== "T"){ S.toast = "Choose Tenor for this prototype."; render(); }
      else go("sync");
      break;
    // sync
    case "to-parts": go("parts"); break;
    case "nudge": S.sync.hist.push(S.sync.offset); S.sync.offset = Math.max(-5, Math.min(5, Math.round((S.sync.offset + Number(arg)) * 100) / 100)); render(); break;
    case "sync-play":
      S.sync.playing = !S.sync.playing;
      if (S.sync.playing) S.sync.t = 0;
      render(); break;
    case "sync-mark":
      S.sync.hist.push(S.sync.offset); S.sync.marker = S.sync.t;
      S.sync.offset = -Math.round(S.sync.t * 100) / 100; render(); break;
    case "sync-undo": if (S.sync.hist.length){ S.sync.offset = S.sync.hist.pop(); S.sync.marker = null; } render(); break;
    case "sync-done":
      if (Math.abs(S.sync.offset - SYNC_TRUE) > .12){ S.sync.playing = false; S.sheet = "sync-warn"; render(); break; }
      S.song = true; S.setupAt = null; go("workspace"); break;
    case "sync-force":
      S.song = true; S.setupAt = null; go("workspace"); S.toast = "Synced, but the track may not match the score."; render(); break;
    // workspace
    case "to-library": go("library"); break;
    case "ws-play":
      if (!w.started){ w.pos = w.loopA - 1; w.started = true; }
      w.playing = !w.playing; render(); break;
    case "ws-restart": w.pos = w.loopA - 1; render(); break;
    case "loop-toggle": w.loop = !w.loop; render(); break;
    case "ws-slower": w.bpm = Math.max(69, w.bpm - 1); w.bpmError = ""; render(); break;
    case "ws-faster": w.bpm = Math.min(BPM, w.bpm + 1); w.bpmError = ""; render(); break;
    case "bpm-edit": if (arg === "ws"){ w.editingBpm = true; w.editPaused = w.playing; w.playing = false; } else { d.editingBpm = true; d.playing = false; } render(); break;
    case "bpm-done": commitBpm(arg, phone.querySelector("[data-bpm-input]").value); break;
    case "ws-metro": w.metro = !w.metro; render(); break;
    case "ws-kb": w.kb = !w.kb; render(); break;
    case "parts-sheet": S.sheet = "parts-vol"; render(); break;
    case "mute": w[arg + "Mute"] = !w[arg + "Mute"]; render(); break;
    case "ws-record":
      if (needMic(a)) break;
      if (w.loopA !== 33 || w.loopB !== 48){ w.playing = false; S.sheet = "off-loop"; render(); }
      else startRecording();
      break;
    case "set-bridge-record": w.loopA = 33; w.loopB = 48; startRecording(); break;
    // record
    case "rec-end": finishRecording(); break;
    case "rec-cancel": S.recPaused = S.rec.phase; S.rec.phase = "idle"; S.sheet = "rec-cancel"; render(); break;
    case "rec-cancel-no": S.rec.phase = S.recPaused || "recording"; S.sheet = null; render(); break;
    case "rec-cancel-yes": go("workspace"); S.toast = "Recording deleted."; render(); break;
    // feedback
    case "to-workspace": go("workspace"); break;
    case "info": S.openInfo = S.openInfo === arg ? null : arg; render(); break;
    case "rerecord": if (needMic(a)) break; w.loopA = 33; w.loopB = 48; startRecording(); break;
    case "save-take": S.cur.saved = !S.cur.saved; render(); break;
    case "ask-discard-take": S.sheet = "discard-take"; render(); break;
    case "discard-take":
      var gone = S.cur.n; S.takes = S.takes.filter(function(t){ return t !== S.cur; });
      S.takes.forEach(function(t, i){ t.n = i + 1; });
      S.cur = S.takes[S.takes.length - 1] || null;
      go("workspace"); S.toast = "Take " + gone + " discarded."; render(); break;
    case "to-issue": go("issue"); break;
    case "start-drill": if (!S.drill) S.drill = freshDrill(); go("drill"); break;
    case "to-feedback": ensureTake(); go("feedback"); break;
    // issue
    case "issue-play":
      if (S.issue.playing === arg){ S.issue.playing = null; stopTones(); render(); break; }
      startIssue(arg, 0, 4); render(); break;
    case "issue-focus":
      var pn = +arg, PP = P42[pn - 1];
      if (S.issue.focus === pn && S.issue.playing === "seg"){ S.issue.playing = null; stopTones(); render(); break; }
      S.issue.focus = pn; startIssue("seg", PP.a, PP.b); render(); break;
    case "issue-details": S.issue.details = !S.issue.details; render(); break;
    // drill
    case "to-drill": go("drill"); break;
    case "dr-play": d.playing = !d.playing; if (d.playing) d.refStarted = true; d.playingBack = false; render(); break;
    case "dr-record": if (needMic(a)) break; startDrillRecording(); break;
    case "mic-allow": S.micAsked = true; S.sheet = null; act(S._afterMic); break;
    case "mic-retry": S.sheet = null; act(S._afterMic); break;
    case "dr-end": endDrillTake(); break;
    case "dr-clean-info": d.cleanInfo = !d.cleanInfo; render(); break;
    case "dr-choice": d.choice = arg; render(); break;
    case "dr-apply":
      d.sheet = null; d.misses = 0; d.streak = 0; d.pos = 0;
      if (d.choice === "beats"){ d.chunk = 0; d.msg = "Sing beat 1 only."; }
      else if (d.choice === "slow"){ d.tempo = 80; d.msg = "Slowed to 80%."; }
      else { d.guidance = true; d.msg = "Guidance back on."; }
      render(); break;
    case "dr-playback":
      d.playingBack = !d.playingBack; d.playing = false;
      if (d.playingBack){
        var lt = d.takes[d.takes.length - 1], bs = 60 / drillBpm();
        var c = lt.chunk !== null ? CHUNKS[lt.chunk] : {a:0, b:4};
        NOTES[42].forEach(function(n){ if (n[1] >= c.a && n[1] < c.b) tone(n[0], n[2] * bs * (lt.clean ? .95 : .6), .24, lt.clean ? 0 : (lt.reason === "pitch" ? -40 : 0), (n[1] - c.a) * bs * (lt.clean || lt.reason !== "timing" ? 1 : .85)); });
        clearTimeout(S._pbT); S._pbT = setTimeout(function(){ if (S.drill){ S.drill.playingBack = false; if (S.view === "drill") render(); } }, (c.b - c.a) * bs * 1000 + 200);
      }
      render(); break;
    case "dr-ask-discard": d.sheet = "discard"; d.playingBack = false; render(); break;
    case "dr-close": d.sheet = null; render(); break;
    case "dr-discard":
      var u = JSON.parse(d.undo), n = d.takes.length;
      for (var k in u) d[k] = u[k];
      d.undo = null; d.sheet = null; S.session.drillTakes = Math.max(0, S.session.drillTakes - 1);
      S.toast = "Take #" + n + " discarded."; render(); break;
    case "dr-reset": S.drill = freshDrill(); render(); break;
    // complete / summary
    case "to-complete": if (S.session.mastered.indexOf(42) < 0) S.session.mastered.push(42); go("complete"); break;
    case "next-problem": arg = "38"; /* falls through */
    case "go-bar":
      var tb = TODO.filter(function(t){ return t.bar === +arg; })[0] || {bar:42, loop:[41,43]};
      w.loopA = tb.loop[0]; w.loopB = tb.loop[1]; w.pos = tb.loop[0] - 1; w.started = false; w.bpm = Math.round(BPM / 2);
      go("workspace"); S.toast = "Looping bars " + tb.loop[0] + "–" + tb.loop[1] + " at half speed."; render(); break;
    case "keep42": S.session.keep42 = !S.session.keep42; render(); break;
    case "hear-ba":
      if (S.baPlaying){ S.baPlaying = false; stopTones(); render(); break; }
      stopTones(); S.baPlaying = true; play42("you", 0, 4, 0); play42("ref", 0, 4, 4.75);
      clearTimeout(S.baTimer); S.baTimer = setTimeout(function(){ S.baPlaying = false; render(); }, 8.9 * 60000 / BPM);
      render(); break;
    case "take-open": S.openTake = S.openTake === +arg ? null : +arg; render(); break;
    case "remind": S.session.remind = !S.session.remind; render(); break;
    case "edit-date": S.dateNote = !S.dateNote; render(); break;
    case "repeat-drill": S.drill = freshDrill(); go("drill"); break;
    case "end-session": go("summary"); break;
    case "done": go("library"); break;
  }
}
// Before the first take, explain why the mic is needed; if it's blocked, say how to allow it.
function needMic(next){
  if (!S.micBlocked && S.micAsked) return false;
  stopAll(); S._afterMic = next; S.sheet = S.micBlocked ? "mic" : "mic-ask"; render();
  return true;
}
function commitBpm(which, raw){
  var n = Number(raw), o = which === "ws" ? S.ws : S.drill;
  if (!raw || isNaN(n) || n < 69 || n > 138){ o.bpmError = "Enter 69 to 138."; render(); return; }
  if (which === "ws") o.bpm = Math.round(n); else o.tempo = Math.round(n / BPM * 100);
  o.editingBpm = false; o.editPaused = false; o.bpmError = ""; render();
}

phone.addEventListener("click", function(e){
  var k = e.target.closest("[data-key]");
  if (k){ ac(); var m = Number(k.dataset.key); tone(m, .6, .3); flashKey(m, .5); return; }
  var el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (S._held && el.hasAttribute("data-hold")){ S._held = false; return; }
  act(el.getAttribute("data-act"), el.getAttribute("data-arg"), el);
});
function rangeFill(el){ var lo = +el.min, hi = +el.max; el.style.setProperty("--p", ((el.value - lo) / (hi - lo) * 100) + "%"); }
phone.addEventListener("input", function(e){
  var t = e.target, k = t.getAttribute("data-input");
  if (t.type === "range") rangeFill(t);
  if (k === "query"){ S.query = t.value; var pos = t.selectionStart; render(); var q = document.getElementById("q"); if (q){ q.focus(); q.setSelectionRange(pos, pos); } }
  else if (k === "title"){ S.imp.title = t.value; S.imp.titleTouched = true;
    var p = t.selectionStart; render(); var ti = document.getElementById("title"); if (ti){ ti.focus(); ti.setSelectionRange(p, p); }
  }
  else if (k === "sync-off"){
    S.sync.offset = Number(t.value);
    var aud = phone.querySelector("[data-aud]"); if (aud) aud.style.transform = "translateX(" + (40 + S.sync.offset * SYNC_PX) + "px)";
    var o = phone.querySelector("[data-off]"); if (o) o.textContent = fmtOff(S.sync.offset);
    var st = phone.querySelector("[data-sync-status]"), ok2 = Math.abs(S.sync.offset - SYNC_TRUE) <= .12;
    if (st){ st.className = "badge " + (ok2 ? "g" : "a"); st.innerHTML = syncStatus(S.sync.offset); }
  }
  else if (k === "ws-tempo"){
    S.ws.bpm = Number(t.value);
    var bb = phone.querySelector(".bpm-btn b"); if (bb) bb.textContent = t.value;
  }
  else if (k === "vol-tenor" || k === "vol-others"){
    var which = k.slice(4); S.ws[which + "Vol"] = Number(t.value);
    var out = phone.querySelector('[data-vol-out="' + which + '"]'); if (out) out.textContent = t.value + "%";
  }
});
phone.addEventListener("change", function(e){
  var k = e.target.getAttribute("data-input");
  if (k === "sync-off"){ S.sync.hist.push(S.sync._before !== undefined ? S.sync._before : S.sync.offset); S.sync._before = undefined; render(); }
  if (k === "vol-tenor" || k === "vol-others" || k === "ws-tempo") render();
});
// Press and hold - / + to keep changing the tempo.
phone.addEventListener("pointerdown", function(e){
  var hb = e.target.closest && e.target.closest("[data-hold]"); if (!hb) return;
  var a = hb.getAttribute("data-act"), n = 0;
  var tmr = setTimeout(function rep(){ act(a); n++; S._held = true; tmr = setTimeout(rep, n < 8 ? 120 : 50); }, 400);
  function stop(){ clearTimeout(tmr); setTimeout(function(){ S._held = false; }, 0); window.removeEventListener("pointerup", stop); window.removeEventListener("pointercancel", stop); }
  window.addEventListener("pointerup", stop); window.addEventListener("pointercancel", stop);
});
phone.addEventListener("pointerdown", function(e){
  if (e.target.matches && e.target.matches('[data-input="sync-off"]')) S.sync._before = S.sync.offset;
  var hd = e.target.closest("[data-hd]"); if (!hd) return;
  e.preventDefault(); ac();
  var tl = phone.querySelector("[data-tl]"), which = hd.dataset.hd;
  hd.setPointerCapture(e.pointerId);
  function move(ev){
    var r = tl.getBoundingClientRect(), x = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    var w = S.ws;
    if (which === "a"){ w.loopA = Math.max(1, Math.min(w.loopB, Math.round(x * NBARS) + 1)); }
    else { w.loopB = Math.max(w.loopA, Math.min(NBARS, Math.round(x * NBARS))); }
    if (w.pos < w.loopA - 1 || w.pos > w.loopB){ w.pos = w.loopA - 1; }
    updateLoopUI();
  }
  function up(){ hd.removeEventListener("pointermove", move); hd.removeEventListener("pointerup", up); hd.removeEventListener("pointercancel", up); render(); }
  hd.addEventListener("pointermove", move); hd.addEventListener("pointerup", up); hd.addEventListener("pointercancel", up);
});
phone.addEventListener("keydown", function(e){
  var t = e.target;
  if (e.key === "Escape" && SETUP[S.view] && !S.sheet && !t.matches("input")){ act("close-setup"); return; }
  if (t.matches("[data-bpm-input]")){
    if (e.key === "Enter") commitBpm(t.getAttribute("data-bpm-input"), t.value);
    if (e.key === "Escape"){ var o = t.getAttribute("data-bpm-input") === "ws" ? S.ws : S.drill; o.editingBpm = false; o.editPaused = false; o.bpmError = ""; render(); }
  }
  if (t.matches("[data-hd]") && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    var w = S.ws, dlt = e.key === "ArrowLeft" ? -1 : 1;
    if (t.dataset.hd === "a") w.loopA = Math.max(1, Math.min(w.loopB, w.loopA + dlt)); else w.loopB = Math.max(w.loopA, Math.min(NBARS, w.loopB + dlt));
    e.preventDefault(); render(); var nh = phone.querySelector('[data-hd="' + t.dataset.hd + '"]'); if (nh) nh.focus();
  }
});
function updateLoopUI(){
  var w = S.ws, bpm = wsBpm();
  var sel = phone.querySelector("[data-sel]"); if (sel){ sel.style.left = ((w.loopA - 1) / NBARS * 100) + "%"; sel.style.width = ((w.loopB - w.loopA + 1) / NBARS * 100) + "%"; }
  var ha = phone.querySelector('[data-hd="a"]'), hb = phone.querySelector('[data-hd="b"]');
  if (ha) ha.style.left = ((w.loopA - 1) / NBARS * 100) + "%"; if (hb) hb.style.left = (w.loopB / NBARS * 100) + "%";
  var lb = phone.querySelector("[data-loop-bars]"); if (lb) lb.textContent = "Loop: bars " + w.loopA + "–" + w.loopB;
  var li = phone.querySelector("[data-loop-info]"); if (li) li.innerHTML = loopLabel(w.loopA, w.loopB) + ' · <span style="white-space:nowrap">' + fmt(barTime(w.loopA - 1, bpm)) + "–" + fmt(barTime(w.loopB, bpm)) + "</span>";
}
guide.addEventListener("click", function(e){
  var el = e.target.closest("[data-gact]"); if (!el) return;
  var a = el.dataset.gact, arg = el.dataset.arg;
  if (a === "mic"){ S.micBlocked = !S.micBlocked; renderGuide(); }
  if (a === "jump") seedTo(arg);
  if (a === "reset"){ stopAll(); S = fresh(); T0 = Date.now(); go("library"); }
});
// Shrink the phone to fit the window height (laptop screens); never enlarge past the 402x830 screen.
function fitPhone(){
  var sc = Math.max(0.55, Math.min(1, (window.innerHeight - 48) / (830 + 26)));
  document.documentElement.style.setProperty("--s", sc.toFixed(3));
}
fitPhone();
window.addEventListener("resize", function(){ fitPhone(); if (S.sheet === "tour") placeTour(); });
window.addEventListener("hashchange", function(){ var v = (location.hash || "").slice(1); if (SCREENS[v] && v !== S.view) seedTo(v); });

/* ================= Boot ================= */
var h0 = (location.hash || "").slice(1);
if (h0 && SCREENS[h0] && h0 !== "library") seedTo(h0); else render();
requestAnimationFrame(tick);
})();
