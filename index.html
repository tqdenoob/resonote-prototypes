<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<meta charset="utf-8">
<title>ResoNote Prototype 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap" rel="stylesheet">
<!--
  ResoNote Iteration 2 high-fidelity prototype (Prototype 2.0), G1T2.
  Built 26 Oct 2026 from the Iter1.4 low-fidelity prototype (16 views) and the
  21 Oct "ResoNote Hi-Fi Drill (HE fixes).html". Follows the Iter2.02 easy scenario:
  Clarence imports "Viva La Vida", picks tenor, fixes a 2-bar count-in offset, loops
  the bridge (bars 33-48) at half speed, records it, and drills bar 42.
  Simulated: file picker, audio-to-score sync, pitch detection, microphone input level,
  AI coach scores and drill results (scripted, the same on every run). Reference audio is
  a Web Audio synth of the tenor line.
  26 Oct UX checklist pass: Confirm sync warns when the track is still off; bar strip uses symbols
  as well as colour; 44px tap targets; larger type; light mode only; one record label ("Record take");
  count-in shows "Get ready"; microphone pre-prompt before the first take.
  26 Oct UI/UX audit pass: score is the hero (bigger staff on a paper band, 2-3 lines); Take Feedback leads
  with "Fix this first"; one colour rule (green good, amber check, orange fix first, blue actions);
  Cancel button on Recording; sync slider centred on 0; sentence-case headings; flat lists.
  LLM declaration: AI-drafted (Claude). The team must run the scenario on a phone-sized
  screen and check every label against Iter2.02, Iter2.03 and Iter2.04 before submitting.
-->
<style>
/* Layout: a phone-sized app on the left, a "prototype guide" rail on the right (stacks below on phones). */
:root{
  /* Three-tone palette: cream background, blue main (actions, selection, your progress), orange accent
     (highlights and "check / fix first"). Green and red are kept only as universal indicators
     (green = good, red = error, recording, delete). Text shades keep 4.5:1 (WCAG 1.4.3). */
  --page:#ECF0F1; --bg:#F9F8F3; --card:#FFFFFF; --sunk:#F2F1EA; --ink:#1B1F24; --muted:#5A6068;
  --line:#E5E3D9; --line2:#D3D0C4; --staff:#8F949A;
  --blue:#1C70AD; --blue-soft:#E3F1FB; --blue-ink:#155A8C; --on-accent:#FFFFFF;
  --orange:#B35C14; --orange-soft:#FCEBDA; --orange-ink:#8A440E;
  --red:#C0392B; --green:#1A7F45; --green-soft:#E6F8ED;
  --scrim:rgba(27,31,36,.48);
  --sec-a:#EEF1EC; --sec-b:#E4E9EC; --wave:#B6BCC2;
  --edge:#80838B; /* 3:1+ boundary for inputs, switch tracks and radios (WCAG 1.4.11) */
  --pw:402px; --ph:830px;
  /* Mobile margins: 16px side gutter (iOS layout margin, Material 16dp). Every tap target and its hover/focus
     background stays inside it. Safe areas keep content clear of the status bar, rounded corners and home indicator. */
  --gutter:16px; --safe-t:44px; --safe-b:34px;
  --f-serif:"Young Serif",Georgia,"Times New Roman",serif; /* greeting and headings only; one weight (400) */
  --f-ui:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light; /* the app is light-only, whatever the OS theme */
}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:15px/1.4 var(--f-ui);padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;max-width:1120px;margin:0 auto}

/* ---------- Guide rail ---------- */
.guide{width:360px;max-width:100%;display:flex;flex-direction:column;gap:14px;min-width:0}
.guide h1{font-family:var(--f-serif);font-weight:400;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.guide .lede{margin:0;color:var(--muted);font-size:13px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.gcard h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.vlist{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.vlist button{width:100%;display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 8px}
.vlist button:hover{background:var(--sunk)}
.vlist button[aria-current="true"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:700}
.vlist .n{font-variant-numeric:tabular-nums;color:var(--muted);width:18px;flex:none;font-size:12px}
.vlist button[aria-current="true"] .n{color:var(--blue-ink)}
.gnow .vn{font-family:var(--f-serif);font-size:17px;font-weight:400}
.gnow p{margin:0;font-size:13px}
.gnow dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:6px 10px;font-size:13px}
.gnow dt{color:var(--muted);font-weight:600}
.gnow dd{margin:0;min-width:0}
.gnow ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.he{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--orange-soft);color:var(--orange-ink);margin-right:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 6px;font-size:13px;font-weight:600;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-accent)}
.gsmall{font-size:12px;color:var(--muted);margin:0}
.grow{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}

/* ---------- Phone ---------- */
.phone{width:var(--pw);height:var(--ph);max-width:100%;border-radius:46px;overflow:hidden;position:relative;background:var(--bg);
  box-shadow:0 0 0 12px var(--ink),0 0 0 13px #3A3C42,0 22px 48px rgba(0,0,0,.22);display:flex;flex-direction:column;flex:none;
  transform:scale(var(--s,1));transform-origin:top left;margin:13px;padding-block:var(--safe-t) var(--safe-b)}
/* simulated iOS status bar and home indicator; drawn on the frame so they sit above every view and overlay */
.phone::before{content:"9:41";position:absolute;top:0;left:0;right:0;height:var(--safe-t);padding:0 32px;display:flex;align-items:center;font-size:15px;font-weight:700;color:var(--ink);pointer-events:none;z-index:40}
.phone::after{content:"";position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);pointer-events:none;z-index:40}
/* screen is 402 x 830 pt: iPhone 16 Pro width; with the 12px bezel the frame is about 2:1, like a real iPhone body */
.phone-box{flex:none;width:calc((var(--pw) + 26px) * var(--s,1));height:calc((var(--ph) + 26px) * var(--s,1))}
@media (max-width:480px){
  .phone-box{width:100%;height:auto}
  .phone{width:100%;height:calc(100svh - 40px);min-height:640px;border-radius:22px;box-shadow:0 0 0 1px var(--line2);transform:none;margin:0;--safe-t:4px;--safe-b:8px}
  .phone::before,.phone::after{display:none} /* on a real phone the OS draws these */
  .wrap{gap:24px}
}
.scr{display:flex;flex-direction:column;height:100%;min-height:0}
.hdr{height:56px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 var(--gutter);flex:none}
.hdr .ttl{text-align:center;min-width:0}
.hdr .ttl b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl span{display:block;font-size:13px;color:var(--muted)}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--sunk)}
.body{padding:2px var(--gutter) 14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.ftr{padding:10px var(--gutter) 12px;display:flex;gap:10px;align-items:center;flex:none;border-top:1px solid var(--line);background:var(--bg)}
.ftr.col{flex-direction:column;align-items:stretch}
.ftr.col .btn{flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:12px 14px}
.h1{font-family:var(--f-serif);font-size:23px;font-weight:400;margin:4px 0 0;line-height:1.2;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:15px}
.sub{font-size:14px;color:var(--muted)}
.lbl{font-size:15px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* section heading: sentence case, no tracking (the old tracked ALL-CAPS label read as template chrome) */
.eyebrow{font-size:15px;font-weight:700;color:var(--ink)}
/* flat section on the page background, used instead of a card for lists */
.sect{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px}
/* the score is printed on a full-width "paper" band, the one surface that isn't a card */
.paper{margin:0 calc(-1 * var(--gutter));background:var(--card);border-block:1px solid var(--line);padding:4px var(--gutter) 10px;display:flex;flex-direction:column;gap:2px}
.paper .scap{padding:6px 0 0}
/* workspace score: drag (or swipe) sideways to page through the bars, 4 at a time */
.drag-score{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.drag-score.dragging{cursor:grabbing}
.drag-score [data-lines]{will-change:transform}
.scap .link{min-height:28px;padding:0;font-size:13px}
.tbtn{min-height:44px;border:0;background:transparent;padding:0 8px;font-size:15px;font-weight:700;color:var(--ink);border-radius:10px}
.tbtn:hover{background:var(--sunk)}
.hdr.wide{grid-template-columns:84px 1fr 84px}
.hdr.wide .tbtn{justify-self:start}
.hdr.wide .ib{justify-self:end}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.seg3 button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px}
.tnum{font-variant-numeric:tabular-nums}

/* step indicator (HE #15) */
.steps3{display:flex;flex-direction:column;gap:6px}
.steps3 .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps3 .bars i{height:5px;border-radius:3px;background:var(--line)}
.steps3 .bars i.on{background:var(--blue)}

/* buttons */
.btn{height:54px;border-radius:16px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;border:0;padding:0 16px}
.btn.pri{flex:1;background:var(--blue);color:var(--on-accent)}
.btn.rec{flex:1;background:var(--blue);color:var(--on-accent)}
.btn.stop{flex:1;background:var(--ink);color:var(--bg)}
.btn.sec{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:15px;font-weight:600}
.btn.ghost{border:1.5px solid var(--blue);background:transparent;color:var(--blue-ink);font-size:15px;font-weight:700}
.btn.danger{background:var(--red);color:var(--on-accent)}
.btn.full{width:100%}
.btn:disabled,.mini:disabled,.sbtn:disabled{opacity:.42;cursor:not-allowed}
.dot{width:12px;height:12px;border-radius:50%;background:currentColor}
.sq{width:12px;height:12px;border-radius:2px;background:currentColor}
.mini{height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.mini.on{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.mini.danger{color:var(--red)}
.link{border:0;background:none;color:var(--blue-ink);font-weight:700;padding:4px 0;font-size:14px;min-height:44px;display:inline-flex;align-items:center}

/* chips & badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.o{background:var(--orange-soft);color:var(--orange-ink)}
.badge.b{background:var(--blue-soft);color:var(--blue-ink)}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.a{background:var(--orange-soft);color:var(--orange-ink)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:600}
.chip.clean{background:var(--green-soft);color:var(--green)}
.chip.miss{background:var(--orange-soft);color:var(--orange-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px}

/* switches */
.switch{display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;padding:0}
.switch .word{font-size:14px;font-weight:700;width:28px;text-align:right}
.track{width:46px;height:28px;border-radius:999px;position:relative;display:inline-block;background:var(--edge);transition:background .15s}
.track.on{background:var(--blue)}
.knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.track.on .knob{left:21px}
.set-row{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:8px}
.set-row+.set-row{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.sbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:20px;line-height:1}
.bpm-btn{min-width:96px;height:44px;border:1px dashed var(--edge);border-radius:10px;background:var(--card);padding:0 6px;font-variant-numeric:tabular-nums}
.bpm-btn b{font-size:16px}
.bpm-btn span{font-size:12px;color:var(--muted)}
.bpm-edit{display:flex;gap:6px;align-items:center}
.bpm-edit input{width:70px;height:44px;border:2px solid var(--blue);border-radius:10px;text-align:center;font-size:16px;background:var(--card)}
.bpm-edit .done{height:44px;padding:0 12px;border-radius:10px;border:0;background:var(--blue);color:var(--on-accent);font-weight:700}
.err{font-size:13px;color:var(--red);font-weight:600}
.req{font-size:12px;font-weight:700;color:var(--red);margin-left:6px}
.file .ft .req{display:inline;color:var(--red);font-size:12px}
.field label.has-req{justify-content:flex-start}
.sheet .btn{flex:none}
input[type=range]{width:100%;margin:0;height:44px;background:transparent;-webkit-appearance:none;appearance:none;--p:50%}
input[type=range]:disabled{opacity:.35;cursor:not-allowed}
.ib.lab{flex-direction:column;gap:1px;width:60px;height:54px;border:1px solid var(--line2);border-radius:16px;font-size:11px;font-weight:700;color:var(--ink)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--blue) var(--p),var(--line2) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--blue)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--blue)}

/* page title: a big serif title and one line on what this screen is for */
.ptitle{display:flex;flex-direction:column;gap:2px;padding-top:2px}
.ptitle .h1{margin:0;font-size:27px}
.ptitle .lead{font-size:15px}
/* workspace coach hub: drills and the last take, one tap from the workspace */
.hub{padding:0 14px}
.hub .hrow{display:flex;align-items:center;gap:12px;min-height:64px;width:100%;border:0;background:transparent;text-align:left;padding:8px 0;color:var(--ink);font:inherit}
.hub .hrow+.hrow{border-top:1px solid var(--line)}
.hub .hic{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue-ink);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:14px}
.hub .htx{flex:1;min-width:0;display:flex;flex-direction:column}
.hub .htx .sub{font-size:13px}
.hub .go{flex:none;color:var(--blue-ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.hub .mini.on{pointer-events:none}
/* drill mode bar: pinned under the header while the workspace is drilling, with the Leave drill exit */
.modebar{flex:none;display:flex;align-items:center;gap:10px;padding:8px var(--gutter);background:var(--blue-soft);border-bottom:1px solid var(--line)}
.modebar .mic2{width:32px;height:32px;border-radius:10px;background:var(--card);color:var(--blue-ink);display:flex;align-items:center;justify-content:center;flex:none}
.modebar .mtx{flex:1;min-width:0;display:flex;flex-direction:column;color:var(--blue-ink);font-size:14px;line-height:1.3}
.modebar .mtx span{font-size:12px;color:var(--ink);opacity:.8}
.modebar .mini{flex:none;background:var(--card);border-color:var(--blue);color:var(--blue-ink);font-weight:700}
/* drill in progress, shown inside the Coach card on the workspace */
.hub .fpanel{border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.link:disabled{opacity:.42;cursor:not-allowed}
/* "Bar 42 fixed" banner on the take that checks the drill */
.fixed{border:2px solid var(--green);display:flex;flex-direction:column;gap:8px}
/* Drills page: bars to fix */
.drow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left}
.drow:first-of-type{border-top:0}
.drow .tn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sunk);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.drow[aria-current="true"] .tn{background:var(--blue);color:var(--on-accent)}
.drow .tb{flex:1;min-width:0;display:flex;flex-direction:column;font-size:15px}
.drow .tb>span{font-size:13px;color:var(--muted)}
.drow .chev{color:var(--muted);display:flex}
/* coach demo video (simulated): dark frame, notes of bar 42, captions */
.vid{flex:none;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vid .frame{position:relative;display:block;width:100%;aspect-ratio:2/1;background:#1B1F24;color:#fff;border:0;padding:0;cursor:pointer}
.vid .frame>svg{position:absolute;inset:0;width:100%;height:100%}
.vid .vn{fill:rgba(255,255,255,.3);transition:fill .2s}
.vid .vn.on{fill:var(--orange-soft)}
.vid .vl{fill:rgba(255,255,255,.55);font:600 11px var(--f-ui)}
.vid .vl.on{fill:#fff}
.vid .who{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);padding:4px 9px;border-radius:999px}
.vid .bigp{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.94);color:#1B1F24;display:flex;align-items:center;justify-content:center}
.vid .cap{position:absolute;left:10px;right:10px;bottom:12px;font-size:14px;line-height:1.3;font-weight:600;background:rgba(0,0,0,.62);padding:6px 9px;border-radius:8px;text-align:center}
.vid .vbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.vid .vbar i{display:block;height:100%;width:0;background:var(--orange-soft)}
.vid .vctl{display:flex;align-items:center;gap:8px;padding:4px 10px}
.vid .vctl .tnum{flex:1}
.vrow{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px}
.vrow .vth{width:56px;height:36px;border-radius:8px;background:#1B1F24;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.vrow .htx{flex:1;min-width:0;display:flex;flex-direction:column}

/* score */
.score{position:relative;margin:0 auto;overflow:hidden}
.score svg{display:block;max-width:100%;height:auto}
.stf .ln{stroke:var(--staff);stroke-width:1}
.stf .bl{stroke:var(--ink);stroke-width:1.3}
.stf .nh{fill:var(--ink);stroke:var(--ink);stroke-width:1.3}
.stf .nh.o{fill:var(--card)}
.stf .st{stroke:var(--ink);stroke-width:1.3}
.stf .bm{fill:var(--ink)}
.stf .num{fill:var(--muted);font:600 11px var(--f-ui)}
.stf .num.on{fill:var(--blue-ink)}
.stf .hl-loop{fill:var(--blue-soft)}
.stf .hl-focus{fill:var(--orange-soft)}
.stf .hl-sel{fill:none;stroke:var(--orange);stroke-width:1.5;stroke-dasharray:3 3}
.stf .dim{fill:var(--card);opacity:.78}
.stf .gd{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:4 4;stroke-linecap:round}
.stf .gn{fill:var(--blue);font:700 11px var(--f-ui)}
.stf .rest{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.stf .nm{fill:var(--blue-ink);font:700 10px var(--f-ui)}
.score+.score{margin-top:2px}
.ph{position:absolute;width:2px;background:var(--blue);pointer-events:none;display:none}
.ph.paused{background:repeating-linear-gradient(var(--blue) 0 6px,transparent 6px 10px)}
.scap{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0;font-size:13px;min-height:28px}
.recl{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:700}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* loop timeline (Change 3, HE #4) */
.tl{position:relative;height:74px;margin:4px 8px 0;touch-action:none;user-select:none}
.tl .secs{position:absolute;left:0;right:0;top:0;height:20px}
.tl .sec{position:absolute;top:0;height:20px;font-size:11px;font-weight:700;color:var(--muted);padding:3px 0 0 4px;white-space:nowrap;overflow:hidden;border-left:1px solid var(--line2)}
.tl .wv{position:absolute;left:0;right:0;top:22px;height:40px;border-radius:6px;background:var(--sunk);overflow:hidden}
.tl .wv svg{width:100%;height:100%;display:block}
.tl .wv rect{fill:var(--wave)}
.tl .sel{position:absolute;top:20px;height:44px;background:rgba(28,112,173,.16);border:2px solid var(--blue);border-radius:6px;pointer-events:none}
.tl .hd{position:absolute;top:16px;width:44px;height:52px;margin-left:-22px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;cursor:ew-resize}
.tl .hd i{width:14px;height:44px;border-radius:5px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tl .hd i::after{content:"";width:2px;height:16px;border-left:1px solid var(--on-accent);border-right:1px solid var(--on-accent);opacity:.8}
.tl .tph{position:absolute;top:20px;height:44px;width:2px;background:var(--ink);pointer-events:none}
.tl .ax{position:absolute;left:0;right:0;bottom:0;height:12px;font-size:11px;color:var(--muted)}
.tl .ax span{position:absolute;transform:translateX(-50%)}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.readout b{font-size:15px}

/* keyboard (HE #18) */
.kbwrap{display:flex;flex-direction:column;gap:4px}
.kbscroll{overflow-x:auto;border-radius:10px;border:1px solid #8F929A;-webkit-overflow-scrolling:touch}
.kb{position:relative;height:110px;display:flex;width:max-content;background:#FAFAF7}
.kb .w{flex:none;width:44px;position:relative;border:0;border-right:1px solid #C9C7BF;background:#FAFAF7;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:10px;font-weight:700;color:#5B5E66}
.kb .w:last-child{border-right:0}
.kb .w.hit{background:var(--blue-soft);color:var(--blue-ink)}
.kb .k{position:absolute;top:0;width:28px;height:60%;background:#17181C;border:0;border-radius:0 0 4px 4px;padding:0}
.kb .k.hit{background:var(--blue)}
.kb .w.mid::before{content:"";position:absolute;bottom:22px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--blue)}
.kb .w.mid{color:var(--blue-ink)}
.kbkey{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kbkey i{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}

/* meter (HE #9) */
.meter{display:flex;align-items:center;gap:10px}
.meter .bars{display:flex;align-items:flex-end;gap:3px;height:26px;flex:none}
.meter .bars i{display:block;width:5px;border-radius:2px;background:var(--green);height:4px}
.meter .lvl{font-size:13px;font-weight:700;color:var(--green);margin-left:auto;text-align:right}
.meter .lvl.wait{color:var(--muted)}

/* lists */
.song{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:16px;text-align:left;width:100%}
.song .art{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.song .meta{flex:1;min-width:0}
.song .meta b{display:block;font-size:15px}
.song .meta span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 4px 10px}
.greet h1{margin:0;display:flex;align-items:center;justify-content:center;gap:10px;max-width:100%;font:400 24px/1.2 var(--f-serif);letter-spacing:-.01em;white-space:nowrap}
.greet h1 span{min-width:0;overflow:hidden;text-overflow:ellipsis} /* greeting stays on one line */
.greet h1 svg{flex:none;color:var(--blue)}
.greet h1 svg rect{animation:hum 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.greet h1 svg rect:nth-child(2){animation-delay:.2s}.greet h1 svg rect:nth-child(3){animation-delay:.4s}
@keyframes hum{50%{transform:scaleY(.55)}}
.lib-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 2px -2px}
.search{display:flex;align-items:center;gap:8px;height:46px;border:1px solid var(--edge);border-radius:14px;padding:0 12px;background:var(--card)}
.search input{border:0;background:transparent;flex:1;min-width:0;height:100%;font-size:15px;outline:none}
.fab{position:absolute;right:var(--gutter);bottom:calc(var(--safe-b) + 12px);height:56px;border-radius:18px;padding:0 20px;border:0;background:var(--blue);color:var(--on-accent);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(52,152,219,.35)}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--line2);background:var(--card)}
.file.ok{border-style:solid;border-color:var(--line)}
.file.bad{border-color:var(--red);border-style:solid}
.file .fi{width:40px;height:40px;border-radius:10px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.file.ok .fi{background:var(--blue-soft);color:var(--blue-ink)}
.file .ft{flex:1;min-width:0}
.file .ft b{display:block;font-size:14px}
.file .ft span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field label{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.field input{width:100%;height:46px;border:1px solid var(--edge);border-radius:12px;padding:0 12px;font-size:15px;background:var(--card)}
.field input.bad{border:2px solid var(--red)}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);width:100%;text-align:left}
.opt.on{border:2px solid var(--blue);background:var(--blue-soft)}
.opt .ot{font-size:15px;font-weight:700;display:block}
.opt .od{font-size:13px;color:var(--muted);display:block}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--edge);flex:none;display:flex;align-items:center;justify-content:center}
.opt.on .radio{border-color:var(--blue)}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}

/* feedback */
.overall{display:flex;align-items:center;gap:14px}
.ring{width:72px;height:72px;flex:none}
.ring .bg{stroke:var(--line);fill:none;stroke-width:8}
.ring .fg{stroke:var(--blue);fill:none;stroke-width:8;stroke-linecap:round}
.ring .fg.a{stroke:var(--orange)}
.ring .fg.g{stroke:var(--green)}
.ring text{fill:var(--ink);font:800 20px var(--f-ui)}
.ring text.of{fill:var(--muted);font:600 10px var(--f-ui)}
.metric{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.metric+.metric{border-top:1px solid var(--line)}
.metric .top{display:flex;align-items:center;gap:6px}
.metric .nm{font-size:15px;font-weight:700}
.metric .sc{margin-left:auto;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.metric .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.metric .bar i{display:block;height:100%;border-radius:3px}
.metric .tip{font-size:13px;background:var(--sunk);border-radius:10px;padding:8px 10px}
/* .mtip, not .tip: .tip is the Help tour bubble (position:absolute), which made this float over the (i) button and ignore scrolling */
.mtip{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.4;background:var(--sunk);border-radius:10px;padding:4px 4px 4px 10px}
.mtip span{flex:1}
.mtip .x{width:44px;height:44px;flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center;padding:0}
/* 44px hit area around a 28px circle; negative margin keeps the metric row compact */
.info{width:44px;height:44px;margin:-8px -6px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.info span{width:28px;height:28px;border-radius:50%;border:1px solid var(--edge);background:var(--card);font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center}
.info[aria-expanded="true"] span{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
/* fixed-width cells that scroll sideways, so a loop of any length (e.g. bars 31-60) keeps readable cells */
.bstrip{display:grid;grid-auto-flow:column;grid-auto-columns:30px;gap:3px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.bstrip::-webkit-scrollbar{height:6px}
.bstrip::-webkit-scrollbar-thumb{background:var(--edge);border-radius:3px}
.bstrip span{scroll-snap-align:start}
/* each cell carries a symbol as well as a colour, so status never relies on colour alone */
.bstrip span{height:38px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700;line-height:1}
.bstrip span i{font-style:normal;font-size:11px}
.bstrip .g{background:var(--green-soft);color:var(--green)}
.bstrip .a{background:var(--orange-soft);color:var(--orange-ink)}
.bstrip .r{background:var(--orange);color:var(--on-accent)}
.prio{border:2px solid var(--orange);background:var(--card)}
.issue{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.issue .tag{flex:none;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--orange-soft);color:var(--orange-ink);min-width:62px;text-align:center}
.saved{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--green)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.cmp{display:flex;align-items:center;gap:12px;padding:10px 14px}
.cmp .pb{width:44px;height:44px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;flex:none}
.cmp .pb.you{background:var(--orange-soft);color:var(--orange-ink)}
.cmp .pb.ref{background:var(--blue-soft);color:var(--blue-ink)}
.chart .tg{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1}
.chart .you{fill:none;stroke:var(--orange);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:600 11px var(--f-ui)}
.chart .an{fill:var(--orange-ink);font:700 11px var(--f-ui)}
.chart .cur{stroke:var(--ink);stroke-width:1.5}
.chart .fz{fill:var(--orange-soft);opacity:.7}
.chart .brk{fill:none;stroke:var(--orange-ink);stroke-width:1.5}
.chart .mkr circle{fill:var(--orange)}
.chart .mn{fill:var(--on-accent);font:800 10px var(--f-ui)}
.pcard{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
.pcard.on{border:2px solid var(--orange);background:var(--orange-soft)}
.pcard .pn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--orange);color:var(--on-accent);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pcard .pb2{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.pcard .pt{display:flex;align-items:center;gap:8px;font-size:15px}
.pcard .pi{margin-left:auto;color:var(--orange-ink);display:flex}
.pcard .pa{font-size:14px;font-weight:700}
.pcard .pw{font-size:13px;color:var(--muted)}
.pcard .pd{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:6px 8px;margin-top:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.lg{width:18px;height:18px;border-radius:4px;font-style:normal;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.lg.g{background:var(--green-soft);color:var(--green)}
.lg.a{background:var(--orange-soft);color:var(--orange-ink)}
.lg.r{background:var(--orange);color:var(--on-accent)}

/* drill */
.coach-head{display:flex;justify-content:space-between;align-items:center;padding-top:12px}
.coach-tag{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--blue-ink);background:var(--blue-soft);padding:3px 8px;border-radius:999px}
.dsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0 4px}
.dsteps .bar{height:6px;border-radius:3px;background:var(--line)}
.dsteps .bar.on{background:var(--blue)}
.dsteps .t{font-size:12px;line-height:1.25;color:var(--muted);margin-top:4px}
.dsteps .t.on{font-weight:700;color:var(--ink)}
.ro{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 0 12px}
.ro div{background:var(--sunk);border-radius:10px;padding:6px 10px}
.ro .k{font-size:12px;color:var(--muted)}
.ro .v{font-size:15px;font-weight:700}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);border:1px dashed var(--line2)}
/* goal slots are status, not buttons: no button border, green when filled */
.slot{border:0;background:var(--sunk)}
.slot.next{color:var(--ink)}
.slot.done{background:var(--green-soft);color:var(--green);border:0}
.msg{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.msg.clean{color:var(--green)}
.msg.miss{color:var(--orange-ink)}
.countin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:44px;font-weight:800;color:var(--blue);background:color-mix(in srgb,var(--card) 92%,transparent);pointer-events:none}
.countin span{font-size:15px;font-weight:700;color:var(--muted)}

/* summary */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--sunk);border-radius:14px;padding:10px 12px}
.stat3 b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat3 span{font-size:13px;color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;font-size:13px}
.hist div+div,.hist .trow+div,.hist div+.trow,.hist .trow+.trow{border-top:1px solid var(--line)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:8px 0;font-size:13px;width:100%;border:0;background:none;color:var(--ink);text-align:left}
.trow .chev{display:inline-flex;vertical-align:middle;color:var(--muted)}
.trow .chev.up{transform:rotate(90deg)}
.hist .trow+.tdet{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 0 8px;border-top:0}
.todo{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left}
.eyebrow+.todo,.row+.todo{border-top:0}
.todo .tn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.todo .tb{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.todo .tb>span{font-size:13px;color:var(--muted)}
.todo .chev{color:var(--muted);display:flex}
.nextc{border:2px solid var(--blue)}
.nextc .remind{border-top:1px solid var(--line);margin-top:6px}
.big-ic{width:56px;height:56px;border-radius:50%;background:var(--green);color:var(--on-accent);display:flex;align-items:center;justify-content:center}

/* sync */
.sync{position:relative;padding:12px 0 8px;overflow:hidden;flex:none}
.sync .lane{position:relative;height:46px;margin:0 12px}
.sync .lane+.lane{margin-top:12px}
.sync .lt{font-size:12px;font-weight:700;color:var(--muted);margin:0 12px 4px;text-align:right}
.sync .bx{position:absolute;top:0;height:46px;border:1px solid var(--line2);border-radius:6px;background:var(--sunk);font-size:11px;font-weight:700;color:var(--muted);padding:3px 4px;white-space:nowrap;overflow:hidden}
.sync .bx i{position:absolute;bottom:8px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.sync .aud{position:absolute;top:0;height:46px;left:0;will-change:transform}
.sync .aud .sn{position:absolute;top:8px;height:30px;border-radius:4px;background:var(--wave)}
.sync .aud .wf{position:absolute;left:0;top:-3px;height:40px;overflow:visible}
.sync .aud .wf .c{fill:var(--orange)}
.sync .aud .wf .v{fill:var(--muted)}
.sync .aud .lab{position:absolute;top:36px;font-size:12px;font-weight:700;color:var(--orange-ink);white-space:nowrap}
.sync .mk{position:absolute;top:8px;bottom:6px;width:2px;background:var(--blue);z-index:2}
.sync .mk span{position:absolute;top:-2px;left:5px;font-size:12px;font-weight:700;color:var(--blue-ink);white-space:nowrap}
.sync .uph{position:absolute;top:28px;bottom:6px;width:2px;background:var(--ink);z-index:3;display:none}
.sync .umk{position:absolute;top:70px;height:46px;width:2px;background:var(--green);z-index:2}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(var(--safe-b) + 8px);display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto}
.sheet h3{margin:0;font-size:19px;text-wrap:balance}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
.tour{position:absolute;inset:0;z-index:30}
.spot{position:absolute;border:3px solid var(--orange);border-radius:14px;box-shadow:0 0 0 2000px rgba(13,14,17,.62);pointer-events:none;transition:all .2s}
.tip{position:absolute;left:var(--gutter);right:var(--gutter);background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px}
.tip .tt{font-size:16px;font-weight:700}
.tip .tx{font-size:14px;line-height:1.45}
.tip .tn{display:flex;justify-content:space-between;align-items:center}
.toast{position:absolute;left:var(--gutter);right:var(--gutter);bottom:calc(var(--safe-b) + 84px);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:25}
.toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);border-radius:10px;height:44px;padding:0 12px;font-weight:700;flex:none}
/* setup popup (views 2-4): opens over the library like onboarding, Close keeps progress */
.setup-scrim{z-index:15}
.setup{background:var(--bg);border-radius:24px 24px 0 0;height:calc(100% - var(--safe-t) - 8px);display:flex;flex-direction:column;min-height:0;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.setup.enter{animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(48px)}}
.setup .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0;flex:none}
.setup .hdr{grid-template-columns:96px 1fr 96px;height:52px}
/* overlays cover the whole frame, so their footers clear the home indicator themselves */

/* ================= Audio (Web Audio synth) ================= */
var AU = {ctx:null, out:null, live:[]};
function ac(){
  if (!AU.ctx){
    try { var C = window.AudioContext || window.webkitAudioContext; AU.ctx = new C(); AU.out = AU.ctx.createGain(); AU.out.gain.value = .55; AU.out.connect(AU.ctx.destination); }
    catch(e){ AU.ctx = null; }
  }
  if (AU.ctx && AU.ctx.state === "suspended") AU.ctx.resume();
  return AU.ctx;
}
function tone(midi, dur, vol, detune, delay){
  var c = ac(); if (!c || vol <= 0) return;
  var t = c.currentTime + (delay||0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = "triangle"; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12); o.detune.value = detune || 0;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
  g.gain.setValueAtTime(vol, t + Math.max(.03, dur - .06)); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g); g.connect(AU.out); o.start(t); o.stop(t + dur + .05);
  AU.live.push(o); o.onended = function(){ var i = AU.live.indexOf(o); if (i >= 0) AU.live.splice(i, 1); };
}
function stopTones(){ AU.live.splice(0).forEach(function(o){ try { o.stop(); } catch(e){} }); }
function click(accent){
  var c = ac(); if (!c) return;
  var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = "square"; o.frequency.value = accent ? 1600 : 1100;
  g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .05);
  o.connect(g); g.connect(AU.out); o.start(t); o.stop(t + .06);
}
function chord(bar, vol){
  var n = NOTES[bar][0][0] - 12;
  [n, n + 4, n + 7].forEach(function(m){ tone(m, .5, vol * .5); });
}

/* Transport: positions are in bars, 0-based (bar n spans n-1 .. n). */
function advance(tr, dt, onNote, onBeat){
  var barSec = 240 / tr.bpm;
  var p0 = tr.pos, p1 = p0 + dt / barSec;
  function scan(a, z){
    for (var bi = Math.floor(a); bi < z; bi++){
      var bar = bi + 1; if (bar > NBARS) break;
      if (onNote) NOTES[bar].forEach(function(n){ var t = bi + n[1] / 4; if (t >= a && t < z) onNote(n, bar, barSec); });
      if (onBeat) for (var k = 0; k < 4; k++){ var tb = bi + k / 4; if (tb >= a && tb < z) onBeat(k, bar); }
    }
  }
  if (p1 >= tr.b){
    scan(p0, tr.b);
    if (tr.loop){ p1 = tr.a + (p1 - tr.b); scan(tr.a, p1); tr.pos = p1; return false; }
    tr.pos = tr.b; return true;
  }
  scan(p0, p1); tr.pos = p1; return false;
}

var NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
var STEP_IDX = {0:0,2:1,4:2,5:3,7:4,9:5,11:6};
function stepOf(m){ return (Math.floor(m / 12) - 1) * 7 + STEP_IDX[m % 12]; }
function noteName(m){ return NAMES[m % 12] + (Math.floor(m / 12) - 1); }
var GAP = 7;
function staffGeom(bars, W){ var L = 4; return {L:L, bw:(W - L * 2) / bars.length, top:24}; }
function noteX(g, i, beat){ return g.L + i * g.bw + 10 + beat / 4 * (g.bw - 16); }
function staff(bars, W, o){
  // o.gap = staff line spacing in px (7 = compact). Everything vertical scales with it.
  o = o || {};
  var k = (o.gap || 7) / 7, GAP = 7 * k, R = function(v){ return +(v * k).toFixed(2); };
  var g = staffGeom(bars, W), top = R(24), both = o.names && o.guide, H = top + 4 * GAP + R(26) + (both ? R(16) : 0), s = "";
  s += '<svg class="stf" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Score, tenor part, bars ' + bars[0] + ' to ' + bars[bars.length - 1] + '">';
  bars.forEach(function(b, i){
    var x = g.L + i * g.bw;
    if (o.loop && b >= o.loop[0] && b <= o.loop[1]) s += '<rect class="hl-loop" x="' + x + '" y="' + (top - R(16)) + '" width="' + g.bw + '" height="' + (4 * GAP + R(34)) + '"/>';
    if (o.focus === b) s += '<rect class="hl-focus" x="' + (x + 1) + '" y="' + (top - R(16)) + '" width="' + (g.bw - 2) + '" height="' + (4 * GAP + R(34)) + '" rx="6"/>';
  });
  for (var q = 0; q < 5; q++) s += '<line class="ln" x1="' + g.L + '" x2="' + (W - g.L) + '" y1="' + (top + q * GAP) + '" y2="' + (top + q * GAP) + '"/>';
  for (var j = 0; j <= bars.length; j++){ var bx = g.L + j * g.bw; s += '<line class="bl" x1="' + bx + '" x2="' + bx + '" y1="' + top + '" y2="' + (top + 4 * GAP) + '"/>'; }
  bars.forEach(function(b, i){
    var x0 = g.L + i * g.bw;
    s += '<text class="num' + ((o.focus === b) ? " on" : "") + '" x="' + (x0 + 3) + '" y="' + (top - R(8)) + '">' + b + '</text>';
    var ns = NOTES[b], yOf = function(m){ return top + 4 * GAP - (stepOf(m + 12) - 30) * GAP / 2; };
    if (ns[0][1] > 0){ var rx = noteX(g, i, 0); s += '<path class="rest" d="M' + (rx - R(2)) + ' ' + (top + R(6)) + 'l' + R(4) + ' ' + R(5) + ' ' + R(-4) + ' ' + R(5) + ' ' + R(5) + ' ' + R(6) + '"/>'; }
    var groups = {};
    ns.forEach(function(n){ if (n[2] === .5){ var key = Math.floor(n[1]); (groups[key] = groups[key] || []).push(n); } });
    ns.forEach(function(n){
      var x = noteX(g, i, n[1]), y = yOf(n[0]), st = stepOf(n[0] + 12);
      for (var lst = 28; lst >= st; lst -= 2){ var ly = top + 4 * GAP - (lst - 30) * GAP / 2; s += '<line class="st" x1="' + (x - R(8)) + '" x2="' + (x + R(8)) + '" y1="' + ly + '" y2="' + ly + '"/>'; }
      for (var hst = 40; hst <= st; hst += 2){ var hy = top + 4 * GAP - (hst - 30) * GAP / 2; s += '<line class="st" x1="' + (x - R(8)) + '" x2="' + (x + R(8)) + '" y1="' + hy + '" y2="' + hy + '"/>'; }
      s += '<ellipse class="nh' + (n[2] >= 2 ? " o" : "") + '" cx="' + x + '" cy="' + y + '" rx="' + R(4.6) + '" ry="' + R(3.4) + '" transform="rotate(-20 ' + x + ' ' + y + ')"/>';
      if (o.names) s += '<text class="nm" x="' + (x - 5) + '" y="' + (top + 4 * GAP + R(22)) + '">' + NAMES[n[0] % 12] + '</text>';
      if (n[2] < 4 && n[2] !== .5){ var up = st < 34; s += up ? '<line class="st" x1="' + (x + R(4.3)) + '" x2="' + (x + R(4.3)) + '" y1="' + y + '" y2="' + (y - R(22)) + '"/>' : '<line class="st" x1="' + (x - R(4.3)) + '" x2="' + (x - R(4.3)) + '" y1="' + y + '" y2="' + (y + R(22)) + '"/>'; }
    });
    Object.keys(groups).forEach(function(key){
      var gr = groups[key], all = ns.filter(function(n){ return n[2] === .5; }), avg = 0;
      all.forEach(function(n){ avg += stepOf(n[0] + 12); }); avg /= all.length;
      var up = avg < 34, pts = gr.map(function(n){ return {x:noteX(g, i, n[1]) + (up ? R(4.3) : -R(4.3)), y:yOf(n[0])}; });
      var tip = up ? Math.min.apply(null, pts.map(function(p){ return p.y; })) - R(22) : Math.max.apply(null, pts.map(function(p){ return p.y; })) + R(22);
      pts.forEach(function(p){ s += '<line class="st" x1="' + p.x + '" x2="' + p.x + '" y1="' + p.y + '" y2="' + tip + '"/>'; });
      if (pts.length > 1) s += '<rect class="bm" x="' + pts[0].x + '" y="' + (up ? tip : tip - R(3.5)) + '" width="' + (pts[pts.length - 1].x - pts[0].x + 1) + '" height="' + R(3.5) + '"/>';
      else s += '<path class="st" d="M' + pts[0].x + ' ' + tip + 'q' + R(6) + ' ' + R(6) + ' ' + R(5) + ' ' + R(12) + '" fill="none"/>';
    });
    if (o.guide === b){
      var pl = ns.map(function(n){ return noteX(g, i, n[1]) + ',' + (yOf(n[0]) - R(9)); }).join(" ");
      s += '<polyline class="gd" points="' + pl + ' ' + (x0 + g.bw - 6) + ',' + (yOf(ns[ns.length - 1][0]) - R(9)) + '"/>';
      var gy = top + 4 * GAP + (o.names ? R(38) : R(20));
      for (var bt = 0; bt < 4; bt++) s += '<text class="gn" x="' + (noteX(g, i, bt) - 3) + '" y="' + gy + '">' + (bt + 1) + '</text>';
    }
    if (o.chunk && o.chunkBar === b){
      var cx1 = noteX(g, i, o.chunk.a) - 8, cx2 = o.chunk.b >= 4 ? x0 + g.bw : noteX(g, i, o.chunk.b) - 8;
      if (cx1 > x0) s += '<rect class="dim" x="' + x0 + '" y="' + (top - R(16)) + '" width="' + (cx1 - x0) + '" height="' + (4 * GAP + R(40)) + '"/>';
      if (cx2 < x0 + g.bw) s += '<rect class="dim" x="' + cx2 + '" y="' + (top - R(16)) + '" width="' + (x0 + g.bw - cx2) + '" height="' + (4 * GAP + R(40)) + '"/>';

}
// The playhead box as percentages of the staff's height, so it stays aligned when the SVG scales down on narrow phones.
function phStyle(o){

var SYNC_TRUE = -2 * 240 / BPM;   // -3.478 s
var SYNC_PX = 22;                 // pixels per second in the sync view
var SYNC_AUTO = Math.round(SYNC_TRUE * 100) / 100;   // where auto line-up lands (-3.48 s)
var SYNC_AUTO_LEN = 1.8;          // seconds the scripted auto line-up animation takes
// Learning-track waveform: count-in clicks (orange spikes) then the sung tenor notes (attack, sustain with a little
// wobble, release). Same shape every run.
function syncWave(){
  var beat = 60 / BPM, end = -SYNC_TRUE + 4 * 240 / BPM, W = Math.ceil(end * SYNC_PX) + 4, H = 40, mid = H / 2, step = 1.5;
  var notes = [];
  for (var bb = 1; bb <= 4; bb++) NOTES[bb].forEach(function(n){ notes.push({t:-SYNC_TRUE + (bb - 1) * 240 / BPM + n[1] * beat, d:n[2] * beat * .8, m:n[0]}); });
  var c = "", v = "";
  for (var x = 0; x < W; x += step){
    var t = x / SYNC_PX, a = 0, click = false;
    for (var k = 0; k < 8; k++){ var dt = t - k * beat; if (dt >= 0 && dt < .14){ a = Math.max(a, (k % 4 === 0 ? 1 : .7) * Math.exp(-dt * 22)); click = true; } }
    notes.forEach(function(n){
      var dt = t - n.t; if (dt < 0 || dt > n.d + .06) return;
      var env = dt < .03 ? dt / .03 : dt > n.d ? 1 - (dt - n.d) / .06 : .8 + .2 * Math.exp(-(dt - .03) * 6);
      a = Math.max(a, env * (.55 + .03 * (n.m - 52)) * (.85 + .15 * Math.sin(x * 1.7 + n.m)));
    });
    if (a < .04) continue;
    var hh = Math.max(2, a * (H - 2)), r = '<rect x="' + x + '" y="' + (mid - hh / 2).toFixed(1) + '" width="1.1" height="' + hh.toFixed(1) + '" rx=".7"/>';
    if (click) c += r; else v += r;
  }
  return '<svg class="wf" width="' + W + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><g class="c">' + c + '</g><g class="v">' + v + '</g></svg>';
}
function syncStatus(off){
  var err = Math.abs(off - SYNC_TRUE);
  return err <= .12 ? I.tick(12) + "Lined up" : err.toFixed(2) + " s off";
}

/* ================= Drill logic ================= */
function drillSnapshot(){ var d = S.drill; return JSON.stringify({tempo:d.tempo, guidance:d.guidance, chunk:d.chunk, takes:d.takes, streak:d.streak, misses:d.misses, targetTries:d.targetTries, msg:d.msg, last:d.last}); }
function barSecs(){ var r = drillRange(); return (r.b - r.a) * 240 / drillBpm(); }
function drillRange(){ var d = S.drill, c = d.chunk !== null ? CHUNKS[d.chunk] : {a:0, b:4}; return {a:d.bar - 1 + c.a / 4, b:d.bar - 1 + c.b / 4}; }
function judgeDrill(){
  // Scripted: the first 2 takes at the goal settings (whole bar, 100%, guidance off) are missed.
  var d = S.drill, atTarget = d.tempo >= 100 && !d.guidance && d.chunk === null;
  var ms = BARS[d.bar].misses;
  if (atTarget && d.targetTries < ms.length) return {clean:false, reason:ms[d.targetTries], atTarget:true};
  return {clean:true, atTarget:atTarget};
}
function markDrill(){
  var d = S.drill, r = judgeDrill();

  var take = {n:d.takes.length + 1, tempo:d.tempo, guidance:d.guidance, chunk:d.chunk, clean:r.clean, reason:r.reason || null};
  d.takes = d.takes.concat([take]); d.phase = "idle"; S.session.drillTakes++;
  if (d.takes.length === 1) d.vid.open = false;
  d.last = {clean:r.clean, reason:r.reason, n:take.n};
  if (r.clean){
    d.misses = 0;
    if (d.chunk !== null){
      if (d.chunk < 2){ d.chunk++; d.msg = "Clean. Now " + CHUNKS[d.chunk].name.toLowerCase() + "."; }
      else { d.chunk = null; d.streak = 0; d.vid = freshVid(d.bar, "bar", false); d.msg = "Now the whole bar, on your own."; }

      S.toast = "Coach set the loop to bar " + pb + " at " + drillBpm() + " BPM" + (dz.guidance ? ", guidance on." : "."); render(); break;
    case "leave-drill":
      w.focus = null; w.playing = false; S.toast = "Drill paused. Tap Drills to pick it up again."; render(); break;
    case "check-bridge":
      // Mastered: sing the whole bridge to check the bar in context.
      d.sheet = null; w.focus = null; w.loopA = 33; w.loopB = 48; w.bpm = BPM; w.pos = 32; w.started = false; act("ws-record"); break;
    case "drill-later":
      d.sheet = null; w.focus = null; w.loopA = 33; w.loopB = 48; w.bpm = BPM; w.pos = 32; w.started = false;
      S.toast = "Bar " + d.bar + " done. Sing the bridge when you're ready to check it."; render(); break;
    case "ws-feedback": S.cur = S.takes[S.takes.length - 1]; S.openInfo = null; S._bsScroll = undefined; go("feedback"); break;
    // summary
    case "next-problem": act("open-drills", String(nextBar() || 42)); break;
    case "hear-ba":
      if (S.baPlaying){ S.baPlaying = false; stopTones(); render(); break; }
      var hb = +(arg || 42); stopTones(); S.baPlaying = hb; playBar(hb, "you", 0, 4, 0); playBar(hb, "ref", 0, 4, 4.75);
      clearTimeout(S.baTimer); S.baTimer = setTimeout(function(){ S.baPlaying = false; render(); }, 8.9 * 60000 / BPM);
      render(); break;
    case "take-open": S.openTake = S.openTake === +arg ? null : +arg; render(); break;
    case "remind": S.session.remind = !S.session.remind; render(); break;
    case "edit-date": S.dateNote = !S.dateNote; render(); break;
    case "end-session": go("summary"); break;
    case "done": go("library"); break;
  }
}
// Before the first take, explain why the mic is needed; if it's blocked, say how to allow it.
function needMic(next){
  if (!S.micBlocked && S.micAsked) return false;
  stopAll(); S._afterMic = next; S.toast = ""; S.sheet = S.micBlocked ? "mic" : "mic-ask"; render();
  return true;
}
function commitBpm(which, raw){
  var n = Number(raw), o = which === "ws" ? S.ws : S.drill;
  if (!raw || isNaN(n) || n < 69 || n > 138){ o.bpmError = "Enter 69 to 138."; render(); return; }
  if (which === "ws"){ o.bpm = Math.round(n); userTempo(); } else o.tempo = Math.round(n / BPM * 100);
  o.editingBpm = false; o.editPaused = false; o.bpmError = ""; render();
}

phone.addEventListener("click", function(e){
  var k = e.target.closest("[data-key]");
  if (k){ ac(); var m = Number(k.dataset.key); tone(m, .6, .3); flashKey(m, .5); return; }
  var el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (S._held && el.hasAttribute("data-hold")){ S._held = false; return; }
  act(el.getAttribute("data-act"), el.getAttribute("data-arg"), el);
});
function rangeFill(el){ var lo = +el.min, hi = +el.max; el.style.setProperty("--p", ((el.value - lo) / (hi - lo) * 100) + "%"); }
phone.addEventListener("input", function(e){
  var t = e.target, k = t.getAttribute("data-input");
  if (t.type === "range") rangeFill(t);
  if (k === "query"){ S.query = t.value; var pos = t.selectionStart; render(); var q = document.getElementById("q"); if (q){ q.focus(); q.setSelectionRange(pos, pos); } }
  else if (k === "title"){ S.imp.title = t.value; S.imp.titleTouched = true;
    var p = t.selectionStart; render(); var ti = document.getElementById("title"); if (ti){ ti.focus(); ti.setSelectionRange(p, p); }
  }
  else if (k === "sync-off"){
    S.sync.offset = Number(t.value);
    var aud = phone.querySelector("[data-aud]"); if (aud) aud.style.transform = "translateX(" + (40 + S.sync.offset * SYNC_PX) + "px)";
    var o = phone.querySelector("[data-off]"); if (o) o.textContent = fmtOff(S.sync.offset);
    var st = phone.querySelector("[data-sync-status]"), ok2 = Math.abs(S.sync.offset - SYNC_TRUE) <= .12;
    if (st){ st.className = "badge " + (ok2 ? "g" : "a"); st.innerHTML = syncStatus(S.sync.offset); }
  }
  else if (k === "ws-tempo"){
    S.ws.bpm = Number(t.value); userTempo();
    var bb = phone.querySelector(".bpm-btn b, [data-bpm-val]"); if (bb) bb.textContent = t.value;
  }
  else if (k === "vol-tenor" || k === "vol-others"){
    var which = k.slice(4); S.ws[which + "Vol"] = Number(t.value);
    var out = phone.querySelector('[data-vol-out="' + which + '"]'); if (out) out.textContent = t.value + "%";
  }
});
phone.addEventListener("change", function(e){
  var k = e.target.getAttribute("data-input");
  if (k === "sync-off"){ S.sync.hist.push(S.sync._before !== undefined ? S.sync._before : S.sync.offset); S.sync._before = undefined; render(); }
  if (k === "vol-tenor" || k === "vol-others" || k === "ws-tempo") render();
});
// Press and hold - / + to keep changing the tempo.
phone.addEventListener("pointerdown", function(e){
  var hb = e.target.closest && e.target.closest("[data-hold]"); if (!hb) return;
  var a = hb.getAttribute("data-act"), n = 0;
  var tmr = setTimeout(function rep(){ act(a); n++; S._held = true; tmr = setTimeout(rep, n < 8 ? 120 : 50); }, 400);
  function stop(){ clearTimeout(tmr); setTimeout(function(){ S._held = false; }, 0); window.removeEventListener("pointerup", stop); window.removeEventListener("pointercancel", stop); }
  window.addEventListener("pointerup", stop); window.addEventListener("pointercancel", stop);
});
phone.addEventListener("pointerdown", function(e){
  if (e.target.matches && e.target.matches('[data-input="sync-off"]')) S.sync._before = S.sync.offset;
  var hd = e.target.closest("[data-hd]"); if (!hd) return;
  e.preventDefault(); ac();
  var tl = phone.querySelector("[data-tl]"), which = hd.dataset.hd;
  hd.setPointerCapture(e.pointerId);
  function move(ev){
    var r = tl.getBoundingClientRect(), x = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    var w = S.ws;
    if (which === "a"){ w.loopA = Math.max(1, Math.min(w.loopB, Math.round(x * NBARS) + 1)); }
    else { w.loopB = Math.max(w.loopA, Math.min(NBARS, Math.round(x * NBARS))); }
    if (w.pos < w.loopA - 1 || w.pos > w.loopB){ w.pos = w.loopA - 1; }
    updateLoopUI();
  }
  function up(){ hd.removeEventListener("pointermove", move); hd.removeEventListener("pointerup", up); hd.removeEventListener("pointercancel", up); S.ws.browse = null; loopLeftDrill(); render(); }
  hd.addEventListener("pointermove", move); hd.addEventListener("pointerup", up); hd.addEventListener("pointercancel", up);
});
// Drag the workspace score sideways to page through the bars. The lines follow the pointer, then
// turn 4 bars on release (or spring back if the drag was short or there are no more bars that way).
phone.addEventListener("pointerdown", function(e){
  var box = e.target.closest && e.target.closest("[data-drag-score]");
  if (!box || e.button > 0 || e.target.closest("button")) return;
  var lines = box.querySelector("[data-lines]"), x0 = e.clientX, y0 = e.clientY, dx = 0, on = false;
  var k = box.getBoundingClientRect().width / box.offsetWidth || 1;
  function move(ev){
    dx = (ev.clientX - x0) / k;
    if (!on){ if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(ev.clientY - y0)) return; on = true; box.classList.add("dragging"); try { box.setPointerCapture(e.pointerId); } catch(_){} }
    var first = wsSystem()[0], edge = (dx > 0 && first <= 1) || (dx < 0 && first >= BROWSE_MAX);
    lines.style.transition = "none"; lines.style.transform = "translateX(" + (edge ? dx / 4 : dx) + "px)";
  }
  function up(){
    box.removeEventListener("pointermove", move); box.removeEventListener("pointerup", up); box.removeEventListener("pointercancel", up);
    box.classList.remove("dragging"); if (!on) return;
    var dir = dx < -48 ? 1 : dx > 48 ? -1 : 0, turned = dir && scorePage(dir);
    if (turned){ refreshScore(); drawDynamic(); lines.style.transform = "translateX(" + (dir * 40) + "px)"; }
    lines.getBoundingClientRect();
    lines.style.transition = "transform .18s ease-out"; lines.style.transform = "";
  }
  box.addEventListener("pointermove", move); box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
});
phone.addEventListener("keydown", function(e){
  var t = e.target;
  if (t.matches("[data-drag-score]") && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    e.preventDefault(); if (scorePage(e.key === "ArrowRight" ? 1 : -1)){ refreshScore(); drawDynamic(); }
    return;
  }
  if (e.key === "Escape" && SETUP[S.view] && !S.sheet && !t.matches("input")){ act("close-setup"); return; }
  if (t.matches("[data-bpm-input]")){
    if (e.key === "Enter") commitBpm(t.getAttribute("data-bpm-input"), t.value);
    if (e.key === "Escape"){ var o = t.getAttribute("data-bpm-input") === "ws" ? S.ws : S.drill; o.editingBpm = false; o.editPaused = false; o.bpmError = ""; render(); }
  }
  if (t.matches("[data-hd]") && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    var w = S.ws, dlt = e.key === "ArrowLeft" ? -1 : 1;
    if (t.dataset.hd === "a") w.loopA = Math.max(1, Math.min(w.loopB, w.loopA + dlt)); else w.loopB = Math.max(w.loopA, Math.min(NBARS, w.loopB + dlt));
    w.browse = null;
    e.preventDefault(); loopLeftDrill(); render(); var nh = phone.querySelector('[data-hd="' + t.dataset.hd + '"]'); if (nh) nh.focus();
  }
});
// Moving the loop off the drilled bar means the singer has left the drill: say so, keep the drill's progress.
function loopLeftDrill(){
  var w = S.ws;
  if (w.focus && (w.loopA !== w.focus || w.loopB !== w.focus)){ w.focus = null; S.toast = "Drill paused. Tap Drills to pick it up again."; }
}
function updateLoopUI(){
  var w = S.ws, bpm = wsBpm();
  var sel = phone.querySelector("[data-sel]"); if (sel){ sel.style.left = ((w.loopA - 1) / NBARS * 100) + "%"; sel.style.width = ((w.loopB - w.loopA + 1) / NBARS * 100) + "%"; }
  var ha = phone.querySelector('[data-hd="a"]'), hb = phone.querySelector('[data-hd="b"]');
  if (ha) ha.style.left = ((w.loopA - 1) / NBARS * 100) + "%"; if (hb) hb.style.left = (w.loopB / NBARS * 100) + "%";
  var lb = phone.querySelector("[data-loop-bars]"); if (lb) lb.textContent = loopBarsLabel(w);
  var li = phone.querySelector("[data-loop-info]"); if (li) li.innerHTML = loopLabel(w.loopA, w.loopB) + ' · <span style="white-space:nowrap">' + fmt(barTime(w.loopA - 1, bpm)) + "–" + fmt(barTime(w.loopB, bpm)) + "</span>";
}
guide.addEventListener("click", function(e){
  var el = e.target.closest("[data-gact]"); if (!el) return;
  var a = el.dataset.gact, arg = el.dataset.arg;
  if (a === "mic"){ S.micBlocked = !S.micBlocked; renderGuide(); }
  if (a === "jump") seedTo(arg);
  if (a === "reset"){ stopAll(); S = fresh(); T0 = Date.now(); go("library"); }
});
// Shrink the phone to fit the window height (laptop screens); never enlarge past the 402x830 screen.
function fitPhone(){
  var sc = Math.max(0.55, Math.min(1, (window.innerHeight - 48) / (830 + 26)));
  document.documentElement.style.setProperty("--s", sc.toFixed(3));
}
fitPhone();
window.addEventListener("resize", function(){ fitPhone(); if (S.sheet === "tour") placeTour(); });
window.addEventListener("hashchange", function(){ var v = (location.hash || "").slice(1); if (SCREENS[v] && v !== S.view) seedTo(v); });

/* ================= Boot ================= */
var h0 = (location.hash || "").slice(1);
if (h0 && SCREENS[h0] && h0 !== "library") seedTo(h0); else render();
requestAnimationFrame(tick);
})();
</script>
