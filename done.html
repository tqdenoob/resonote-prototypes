<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task complete · ResoNote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* End page for the tempo A/B test. Loop11 detects task success when this URL loads. */
:root{color-scheme:only light;--page:#ECF0F1;--bg:#F9F8F3;--ink:#1B1F24;--muted:#5A6068;--green:#1A7F45;--line:#E5E3D9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--page);color:var(--ink);font:15px/1.4 "Figtree",system-ui,sans-serif}
.card{max-width:402px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:32px 24px;text-align:center}
.tick{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;font-weight:700}
h1{font-family:"Young Serif",serif;font-weight:400;font-size:27px;line-height:1.2;margin:0 0 8px}
p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="tick" aria-hidden="true">✓</div>
  <h1>Task complete</h1>
  <p>Thank you. Return to the Loop11 window to answer the next questions.</p>
</main>
</body>
</html>
